workflows:

  # ============================================================
  # ANDROID
  # ============================================================

  android-workflow:
    name: Android Build (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21
      node: 22

      vars:
        PACKAGE_NAME: "app.lovable.c6d932101224420590deeec3ccc6923f"

    scripts:

      - name: Install npm dependencies
        script: |
          set -e

          node --version
          npm --version

          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed - retrying with npm install"
            npm install --legacy-peer-deps --no-audit --no-fund
          }

      - name: Install Android SDK
        script: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build web application
        script: |
          set -e
          npm run build

      - name: Generate Android assets
        script: |
          set -e

          npm install @capacitor/assets --save-dev --legacy-peer-deps

          npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        script: |
          set -e

          npx cap sync android

      - name: Validate Android project
        script: |
          set -e

          chmod +x android/gradlew

          ./android/gradlew \
            -p android \
            :app:tasks \
            --no-daemon \
            --stacktrace

      - name: Build Android APK and AAB
        script: |
          set -e

          ./android/gradlew \
            -p android \
            :app:assembleDebug \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/reports/**/*


  # ============================================================
  # iOS TESTFLIGHT
  # ============================================================

  ios-testflight-workflow:
    name: iOS TestFlight Build
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Garáž CHDP"

    environment:
      xcode: latest
      node: 22

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "app.lovable.c6d932101224420590deeec3ccc6923f"


    scripts:

      # --------------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------------

      - name: Install npm dependencies
        script: |
          set -e

          node --version
          npm --version

          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed - retrying with npm install"
            npm install --legacy-peer-deps --no-audit --no-fund
          }


      # --------------------------------------------------------
      # WEB BUILD
      # --------------------------------------------------------

      - name: Build web application
        script: |
          set -e

          npm run build


      # --------------------------------------------------------
      # CAPACITOR ASSETS
      # --------------------------------------------------------

      - name: Generate iOS assets
        script: |
          set -e

          npm install @capacitor/assets --save-dev --legacy-peer-deps

          npx capacitor-assets generate --ios --assetPath resources


      # --------------------------------------------------------
      # CREATE IOS PROJECT IF MISSING
      # --------------------------------------------------------

      - name: Ensure iOS project exists
        script: |
          set -e

          if [ ! -d "ios/App/App.xcodeproj" ]; then

            echo "iOS project missing."
            echo "Creating Capacitor iOS project..."

            rm -rf ios

            npx cap add ios --packagemanager SPM

          else

            echo "iOS project already exists."

          fi


      # --------------------------------------------------------
      # CAPACITOR SYNC
      # --------------------------------------------------------

      - name: Sync Capacitor iOS
        script: |
          set -e

          npx cap sync ios


      # --------------------------------------------------------
      # VERIFY IOS PROJECT
      # --------------------------------------------------------

      - name: Verify iOS project
        script: |
          set -e

          PROJECT="ios/App/App.xcodeproj/project.pbxproj"
          PLIST="ios/App/App/Info.plist"

          echo "=========================================="
          echo "VERIFY IOS PROJECT"
          echo "=========================================="

          test -f "$PROJECT"
          test -f "$PLIST"

          echo "Xcode project:"
          ls -lah ios/App/App.xcodeproj

          echo "Bundle identifiers:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT" || true

          echo "Info.plist:"
          plutil -p "$PLIST"


      # --------------------------------------------------------
      # IOS APP NAME + PERMISSIONS
      # --------------------------------------------------------

      - name: Configure iOS Info.plist
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          echo "Configuring Info.plist..."

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName 'CHDP Garage'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 'CHDP Garage'" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName 'CHDP Garage'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string 'CHDP Garage'" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :NSBluetoothAlwaysUsageDescription 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru ve vozidle.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru ve vozidle.'" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :NSBluetoothPeripheralUsageDescription 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth Low Energy.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth Low Energy.'" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription 'Kamera se používá pro OCR skenování VIN a SPZ.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string 'Kamera se používá pro OCR skenování VIN a SPZ.'" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :NSLocationWhenInUseUsageDescription 'Aplikace používá polohu pro servisní služby, diagnostiku a bezpečnost účtu.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string 'Aplikace používá polohu pro servisní služby, diagnostiku a bezpečnost účtu.'" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST"

          echo "Info.plist configured."

          plutil -p "$PLIST"


      # --------------------------------------------------------
      # APNs ENTITLEMENTS
      # --------------------------------------------------------

      - name: Configure APNs entitlements
        script: |
          set -e

          ENTITLEMENTS="ios/App/App/App.entitlements"

          echo "Creating APNs entitlements..."

          cat > "$ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          echo "Entitlements:"
          cat "$ENTITLEMENTS"


      # --------------------------------------------------------
      # CONNECT ENTITLEMENTS TO XCODE TARGET
      # --------------------------------------------------------

      - name: Configure Xcode entitlements
        script: |
          set -e

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          echo "Configuring CODE_SIGN_ENTITLEMENTS..."

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = path.read_text()

          text = text.replace(
              "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;",
              ""
          )

          lines = text.splitlines()
          output = []

          for line in lines:
              output.append(line)

              if "PRODUCT_BUNDLE_IDENTIFIER =" in line:
                  indent = line[:len(line) - len(line.lstrip())]

                  output.append(
                      f'{indent}CODE_SIGN_ENTITLEMENTS = App/App.entitlements;'
                  )

          path.write_text("\n".join(output) + "\n")

          print("Xcode entitlements configured.")
          PY

          grep -n "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ" || true


      # --------------------------------------------------------
      # CODE SIGNING
      # --------------------------------------------------------
      #
      # IMPORTANT:
      # Do NOT specify CHDP_DIST_PUSH here.
      #
      # Codemagic automatically selects the matching
      # Apple Distribution certificate and App Store profile
      # for the Bundle ID above.
      #
      # --------------------------------------------------------

      - name: Set up iOS code signing
        script: |
          set -e

          echo "Setting up automatic App Store/TestFlight signing..."

          xcode-project use-profiles \
            --project ios/App/App.xcodeproj

          echo "Code signing configuration completed."


      # --------------------------------------------------------
      # VERIFY SIGNING
      # --------------------------------------------------------

      - name: Verify iOS signing configuration
        script: |
          set -e

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          echo "=========================================="
          echo "IOS SIGNING CONFIGURATION"
          echo "=========================================="

          echo "Bundle ID:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ" || true

          echo ""
          echo "Signing:"
          grep -n \
            "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE\|CODE_SIGN_ENTITLEMENTS" \
            "$PBXPROJ" || true

          echo ""
          echo "Available provisioning profiles:"

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles/" \
            || true

          echo ""
          echo "Available certificates:"

          security find-identity \
            -v -p codesigning \
            || true

          echo ""
          echo "APNs entitlement:"

          cat ios/App/App/App.entitlements


      # --------------------------------------------------------
      # BUILD NUMBER
      # --------------------------------------------------------

      - name: Set unique iOS build number
        script: |
          set -e

          cd ios/App

          BUILD_NUMBER="$(date +%Y%m%d%H%M)"

          echo "Using iOS build number: $BUILD_NUMBER"

          agvtool new-version -all "$BUILD_NUMBER"

          echo ""
          echo "Current versions:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            App/Info.plist \
            || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            App/Info.plist \
            || true


      # --------------------------------------------------------
      # BUILD IPA
      # --------------------------------------------------------

      - name: Build signed IPA
        script: |
          set -e

          cd ios/App

          echo "=========================================="
          echo "BUILDING SIGNED IOS IPA"
          echo "=========================================="

          rm -rf /tmp/xcodebuild_logs || true
          mkdir -p /tmp/xcodebuild_logs

          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App


      # --------------------------------------------------------
      # VERIFY IPA
      # --------------------------------------------------------

      - name: Verify signed IPA
        script: |
          set -e

          IPA_PATH="$(find build/ios/ipa -name "*.ipa" -type f | head -1)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          echo "IPA:"
          echo "$IPA_PATH"

          TMP_DIR="$(mktemp -d)"

          unzip -q "$IPA_PATH" -d "$TMP_DIR"

          APP_PATH="$(find "$TMP_DIR/Payload" -name "*.app" -type d | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App bundle not found."
            exit 1
          fi

          echo "App:"
          echo "$APP_PATH"

          echo ""
          echo "Bundle identifier:"
          codesign -d \
            --entitlements :- \
            "$APP_PATH" \
            2>/dev/null \
            | grep -A2 "application-identifier" \
            || true

          echo ""
          echo "Signed entitlements:"

          codesign -d \
            --entitlements :- \
            "$APP_PATH" \
            2>/dev/null \
            > "$TMP_DIR/entitlements.plist"

          cat "$TMP_DIR/entitlements.plist"

          echo ""
          echo "Checking APNs..."

          grep -q "aps-environment" \
            "$TMP_DIR/entitlements.plist" || {
              echo "ERROR: aps-environment missing."
              exit 1
            }

          grep -q "production" \
            "$TMP_DIR/entitlements.plist" || {
              echo "ERROR: APNs environment is not production."
              exit 1
            }

          echo ""
          echo "APNs entitlement OK."
          echo "Signed IPA verification OK."


    # ============================================================
    # ARTIFACTS
    # ============================================================

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


    # ============================================================
    # TESTFLIGHT
    # ============================================================

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true