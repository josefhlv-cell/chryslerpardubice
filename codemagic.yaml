definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

workflows:
  ios-testflight:
    name: CHDP Garage iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "6807151165"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      - name: Install dependencies
        script: |
          set -e
          npm ci

      - name: Build web application
        script: |
          set -e
          npm run build

      - name: Prepare iOS project
        script: |
          set -e

          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap sync ios

          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd -
          fi

      - name: Verify Bundle ID
        script: |
          set -e

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo "=== Bundle ID check ==="

          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          if ! grep -q "cz.chryslerpardubice.chdpgarage" "$PROJECT_FILE"; then
            echo "ERROR: Expected Bundle ID was not found."
            exit 1
          fi

          echo "Bundle ID OK:"
          echo "$BUNDLE_ID"

      - name: Configure iOS code signing
        script: |
          set -e

          echo "Configuring iOS signing through Codemagic..."

          xcode-project use-profiles

      - name: Configure Info.plist permissions
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          plutil -lint "$PLIST"

          echo "Info.plist OK."

      - name: Set version
        script: |
          set -e

          cd ios/App

          echo "Setting marketing version: ${MARKETING_VERSION}"

          agvtool new-marketing-version "${MARKETING_VERSION}"

          if [ -n "${BUILD_NUMBER:-}" ]; then
            echo "Setting build number: ${BUILD_NUMBER}"
            agvtool new-version -all "${BUILD_NUMBER}"
          fi

          cd -

      - name: Build IPA
        script: |
          set -e

          echo "=== Building CHDP Garage IPA ==="
          echo "Bundle ID: ${BUNDLE_ID}"
          echo "Version: ${MARKETING_VERSION}"
          echo "Apple ID: ${APP_STORE_APPLE_ID}"

          if [ -d "ios/App/App.xcworkspace" ]; then

            echo "Using App.xcworkspace"

            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"

          elif [ -d "ios/App/App.xcodeproj" ]; then

            echo "Using App.xcodeproj"

            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"

          else

            echo "ERROR: Neither App.xcworkspace nor App.xcodeproj exists."
            exit 1

          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
