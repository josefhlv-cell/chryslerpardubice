workflows:
  android-workflow:
    name: Android Build (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21
      node: 22
      vars:
        PACKAGE_NAME: "app.lovable.c6d932101224420590deeec3ccc6923f"

    scripts:
      - name: Install npm dependencies clean
        script: |
          set -e
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed, retrying with npm install"
            npm install --legacy-peer-deps --no-audit --no-fund
          }

      - name: Install required Android SDK packages
        script: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web assets Vite
        script: |
          set -e
          npm run build

      - name: Generate Capacitor icons
        script: |
          set -e
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        script: |
          set -e
          npx cap sync android

      - name: Validate Android project
        script: |
          set -e
          chmod +x android/gradlew
          ./android/gradlew -p android :app:tasks --no-daemon --stacktrace

      - name: Build Android Debug APK and Release AAB
        script: |
          set -e
          ./android/gradlew -p android :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace --warning-mode all

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/reports/**/*

  ios-testflight-workflow:
    name: iOS TestFlight Build signed
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Garáž CHDP"

    environment:
      xcode: latest
      node: 22
      ios_signing:
        certificates:
          - CHDP_DIST_PUSH
        provisioning_profiles:
          - CHDP_GARAGE_APPLOVABLE_PROFILE

    scripts:
      - name: Install npm dependencies clean
        script: |
          set -e
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed, retrying with npm install"
            npm install --legacy-peer-deps --no-audit --no-fund
          }

      - name: Build web assets Vite
        script: |
          set -e
          npm run build

      - name: Generate Capacitor icons
        script: |
          set -e
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --ios

      - name: Add iOS platform if missing SPM
        script: |
          set -e
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "iOS project missing — creating fresh project"
            rm -rf ios
            npx cap add ios --packagemanager SPM
          else
            echo "iOS project already exists"
          fi

      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios

      - name: Patch iOS AppDelegate for APNs callbacks
        script: |
          set -e

          APP_DELEGATE="ios/App/App/AppDelegate.swift"

          echo "Patching $APP_DELEGATE for Capacitor Push Notifications callbacks..."

          if grep -q "capacitorDidRegisterForRemoteNotifications" "$APP_DELEGATE"; then
            echo "APNs callbacks already present"
            cat "$APP_DELEGATE"
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/App/App/AppDelegate.swift")
          text = path.read_text()

          insert = '''
              
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''

          if "capacitorDidRegisterForRemoteNotifications" not in text:
              idx = text.rfind("}")
              if idx == -1:
                  raise SystemExit("Cannot find final class closing brace in AppDelegate.swift")
              text = text[:idx] + insert + text[idx:]

          path.write_text(text)
          PY

          echo "Patched AppDelegate.swift:"
          cat "$APP_DELEGATE"

      - name: Force iOS Bundle ID
        script: |
          set -e
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = app.lovable.c6d932101224420590deeec3ccc6923f;/g' "$PBXPROJ"

          echo "Bundle ID after patch:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ" || true

      - name: Patch iOS Push Entitlements
        script: |
          set -e

          echo "Creating App.entitlements with APNs production environment..."

          printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
          '<plist version="1.0">' \
          '<dict>' \
          '    <key>aps-environment</key>' \
          '    <string>production</string>' \
          '</dict>' \
          '</plist>' \
          > ios/App/App/App.entitlements

          echo "Patching Xcode project to use App.entitlements..."

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          sed -i '' 's|CODE_SIGN_ENTITLEMENTS = .*;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PBXPROJ" || true

          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER =/a\
                    CODE_SIGN_ENTITLEMENTS = App/App.entitlements;
            ' "$PBXPROJ"
          fi

          echo "Entitlements file:"
          cat ios/App/App/App.entitlements

      - name: Patch iOS Info.plist permissions
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          echo "Patching $PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru ve vozidle.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru ve vozidle.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth Low Energy.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth Low Energy.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Kamera se používá pro OCR skenování VIN a SPZ.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera se používá pro OCR skenování VIN a SPZ.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Aplikace používá polohu pro servisní služby, diagnostiku a bezpečnost účtu.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Aplikace používá polohu pro servisní služby, diagnostiku a bezpečnost účtu.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string remote-notification" "$PLIST"

          echo "Info.plist patched successfully"
          plutil -p "$PLIST"

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Force Xcode manual signing profile
        script: |
          set -e

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          echo "Forcing manual signing for iOS target..."

          # Bundle ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = app.lovable.c6d932101224420590deeec3ccc6923f;/g' "$PBXPROJ"

          # Manual signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"

          # Team ID
          if grep -q "DEVELOPMENT_TEAM = " "$PBXPROJ"; then
            sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = 7353KNVBCK;/g' "$PBXPROJ"
          else
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER =/a\
                    DEVELOPMENT_TEAM = 7353KNVBCK;
            ' "$PBXPROJ"
          fi

          # Code signing identity
          if grep -q "CODE_SIGN_IDENTITY = " "$PBXPROJ"; then
            sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBXPROJ"
          else
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER =/a\
                    CODE_SIGN_IDENTITY = "Apple Distribution";
            ' "$PBXPROJ"
          fi

          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = [^;]*;/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/g' "$PBXPROJ" || true

          # Provisioning profile SPECIFIER = Apple Developer profile NAME, not Codemagic reference
          if grep -q "PROVISIONING_PROFILE_SPECIFIER" "$PBXPROJ"; then
            sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "CHDP Garage App Store app.lovable";/g' "$PBXPROJ"
          else
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER =/a\
                    PROVISIONING_PROFILE_SPECIFIER = "CHDP Garage App Store app.lovable";
            ' "$PBXPROJ"
          fi

          # Entitlements
          if grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            sed -i '' 's|CODE_SIGN_ENTITLEMENTS = .*;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PBXPROJ"
          else
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER =/a\
                    CODE_SIGN_ENTITLEMENTS = App/App.entitlements;
            ' "$PBXPROJ"
          fi

          echo "Signing settings after patch:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_ENTITLEMENTS" "$PBXPROJ" || true

      - name: Verify iOS signing and entitlements
        script: |
          set -e

          echo "Checking Bundle ID..."
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj || true

          echo "Checking signing settings..."
          grep -n "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj || true

          echo "Checking App.entitlements..."
          cat ios/App/App/App.entitlements

          echo "Checking aps-environment..."
          grep -n "aps-environment" ios/App/App/App.entitlements || {
            echo "ERROR: aps-environment missing"
            exit 1
          }

          echo "Checking production APNs environment..."
          grep -n "production" ios/App/App/App.entitlements || {
            echo "ERROR: aps-environment production missing"
            exit 1
          }

          echo "Checking Info.plist background modes..."
          plutil -p ios/App/App/Info.plist | grep -A8 UIBackgroundModes || true

      - name: Increment iOS build number
        script: |
          set -e
          cd ios/App

          IOS_BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          echo "Setting unique iOS build number to $IOS_BUILD_NUMBER"

          agvtool new-version -all "$IOS_BUILD_NUMBER"

          echo "Current Info.plist versions:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist || true

      - name: Build signed IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App

      - name: Verify built IPA APNs entitlement
        script: |
          set -e

          IPA_PATH="$(ls ios/App/build/ios/ipa/*.ipa | head -1)"
          echo "IPA: $IPA_PATH"

          TMP_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$TMP_DIR"

          APP_PATH="$(find "$TMP_DIR/Payload" -name "*.app" -type d | head -1)"
          echo "APP: $APP_PATH"

          echo "Embedded provisioning profile:"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$TMP_DIR/profile.plist"

          /usr/libexec/PlistBuddy -c "Print :Name" "$TMP_DIR/profile.plist" || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$TMP_DIR/profile.plist" || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$TMP_DIR/profile.plist" || {
            echo "ERROR: aps-environment missing in embedded provisioning profile"
            exit 1
          }

          echo "Signed app entitlements:"
          codesign -d --entitlements :- "$APP_PATH" > "$TMP_DIR/entitlements.plist" 2>/dev/null || {
            echo "ERROR: Cannot read signed entitlements"
            exit 1
          }

          cat "$TMP_DIR/entitlements.plist"

          grep -q "aps-environment" "$TMP_DIR/entitlements.plist" || {
            echo "ERROR: aps-environment missing in signed app"
            exit 1
          }

          grep -q "production" "$TMP_DIR/entitlements.plist" || {
            echo "ERROR: aps-environment is not production"
            exit 1
          }

          echo "APNs entitlement OK"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true