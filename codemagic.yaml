definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

workflows:
  ios-appstore:
    name: CHDP Garage iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    # =========================================================
    # APP STORE CONNECT INTEGRATION
    # =========================================================
    integrations:
      app_store_connect: codemagic

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "6807151165"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    # =========================================================
    # BUILD SCRIPTS
    # =========================================================
    scripts:

      # -------------------------------------------------------
      # 1. Install dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        script: |
          set -e

          echo "Installing npm dependencies..."
          npm ci

      # -------------------------------------------------------
      # 2. Build web application
      # -------------------------------------------------------
      - name: Build web application
        script: |
          set -e

          echo "Building web application..."
          npm run build

      # -------------------------------------------------------
      # 3. Prepare Capacitor iOS project
      # -------------------------------------------------------
      - name: Prepare iOS project
        script: |
          set -e

          echo "Preparing iOS project..."

          if [ ! -d "ios" ]; then
            echo "iOS directory does not exist - creating..."
            npx cap add ios
          fi

          echo "Synchronizing Capacitor..."
          npx cap sync ios

          echo "Installing CocoaPods..."

          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd -
          else
            echo "WARNING: ios/App/Podfile not found."
          fi

      # -------------------------------------------------------
      # 4. Verify Xcode project
      # -------------------------------------------------------
      - name: Verify iOS project
        script: |
          set -e

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "CHDP GARAGE iOS BUILD"
          echo "======================================"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo ""
          echo "Bundle ID expected:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found in Xcode project:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          echo ""

          if ! grep -q "cz.chryslerpardubice.chdpgarage" "$PROJECT_FILE"; then
            echo "ERROR: Expected Bundle ID was not found."
            exit 1
          fi

          echo "Bundle ID verification: OK"

      # -------------------------------------------------------
      # 5. Configure signing
      # -------------------------------------------------------
      - name: Configure iOS signing
        script: |
          set -e

          echo "======================================"
          echo "CONFIGURING CODE SIGNING"
          echo "======================================"

          xcode-project use-profiles

          echo ""
          echo "Signing configuration completed."

      # -------------------------------------------------------
      # 6. Configure Info.plist
      # -------------------------------------------------------
      - name: Configure Info.plist
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          echo "Configuring Info.plist..."

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          # Camera
          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." \
            "$PLIST"

          # Bluetooth
          /usr/libexec/PlistBuddy \
            -c "Delete :NSBluetoothAlwaysUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSBluetoothPeripheralUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." \
            "$PLIST"

          # Location
          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocationWhenInUseUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." \
            "$PLIST"

          echo ""
          echo "Checking Info.plist..."

          plutil -lint "$PLIST"

          echo "Info.plist verification: OK"

      # -------------------------------------------------------
      # 7. Set application version
      # -------------------------------------------------------
      - name: Set application version
        script: |
          set -e

          cd ios/App

          echo "Marketing version:"
          echo "${MARKETING_VERSION}"

          agvtool new-marketing-version "${MARKETING_VERSION}"

          cd -

      # -------------------------------------------------------
      # 8. Set automatic build number
      # -------------------------------------------------------
      - name: Set build number
        script: |
          set -e

          cd ios/App

          echo "Getting latest App Store build number..."

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID" \
              2>/dev/null || echo "0"
          )

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=0
          fi

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest build number:"
          echo "$LATEST_BUILD_NUMBER"

          echo "New build number:"
          echo "$NEW_BUILD_NUMBER"

          agvtool new-version -all "$NEW_BUILD_NUMBER"

          cd -

      # -------------------------------------------------------
      # 9. Final signing verification
      # -------------------------------------------------------
      - name: Final signing verification
        script: |
          set -e

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "FINAL VERIFICATION"
          echo "======================================"

          echo ""
          echo "Bundle ID:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          echo ""
          echo "Code signing:"
          grep "CODE_SIGN" "$PROJECT_FILE" || true

          echo ""
          echo "Entitlements:"
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" || true

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

      # -------------------------------------------------------
      # 10. Build IPA
      # -------------------------------------------------------
      - name: Build IPA
        script: |
          set -e

          echo "======================================"
          echo "BUILDING CHDP GARAGE IPA"
          echo "======================================"

          if [ -f "ios/App/App.xcworkspace" ]; then

            echo "Using workspace:"
            echo "ios/App/App.xcworkspace"

            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"

          elif [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then

            echo "Using project:"
            echo "ios/App/App.xcodeproj"

            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"

          else

            echo "ERROR: iOS Xcode project not found."
            exit 1

          fi

          echo ""
          echo "IPA BUILD FINISHED."

    # =========================================================
    # ARTIFACTS
    # =========================================================
    artifacts:
      - build/ios/ipa/*.ipa

    # =========================================================
    # APP STORE CONNECT / TESTFLIGHT
    # =========================================================
    publishing:

      app_store_connect:

        # Použije App Store Connect API integraci
        # nastavenou nahoře:
        # integrations:
        #   app_store_connect: codemagic
        auth: integration

        # Nahraje vytvořené IPA do App Store Connect
        submit_to_testflight: true

        # NEPOSÍLAT automaticky do App Store Review
        submit_to_app_store: false
