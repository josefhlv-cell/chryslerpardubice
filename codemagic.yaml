definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

  common_scripts:
    - &install_deps
      name: Install dependencies
      script: |
        set -e
        npm ci

    - &build_web
      name: Build web application
      script: |
        set -e
        npm run build

    - &prepare_ios
      name: Prepare iOS project (Capacitor)
      script: |
        set -e
        if [ ! -d "ios" ]; then
          npx cap add ios
        fi
        npx cap sync ios
        # Capacitor sync nemusí spustit pod install -> workspace by pak chyběl
        if [ ! -d "ios/App/App.xcworkspace" ]; then
          cd ios/App
          pod install --repo-update
          cd -
        fi
        ls -la ios/App


    - &set_bundle_id
      name: Apply bundle identifier
      script: |
        set -e
        echo "Target bundle ID: $BUNDLE_ID"
        PROJECT_FILE=$(find ios -name "project.pbxproj" -type f | head -1)
        if [ -z "$PROJECT_FILE" ]; then
          echo "ERROR: Xcode project not found."
          exit 1
        fi
        # Normalise any previously generated identifier to the signed one
        sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$PROJECT_FILE"
        grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"
        echo "Bundle ID applied."

    - &push_entitlements
      name: Enable Push Notifications entitlement
      script: |
        set -e
        PROJECT_FILE=$(find ios -name "project.pbxproj" -type f | head -1)
        APP_DIR=$(dirname "$(dirname "$PROJECT_FILE")")/App
        ENT="$APP_DIR/App.entitlements"
        if [ "$APS_ENVIRONMENT" = "development" ]; then
          APS="development"
        else
          APS="production"
        fi
        if [ ! -f "$ENT" ]; then
          cat > "$ENT" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
        </dict>
        </plist>
        PLIST
        fi
        /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENT" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :aps-environment string $APS" "$ENT"
        plutil -lint "$ENT"
        if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE"; then
          perl -0pi -e "s{PRODUCT_BUNDLE_IDENTIFIER = \Q$BUNDLE_ID\E;}{CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;}g" "$PROJECT_FILE"
        else
          sed -i '' -E "s|CODE_SIGN_ENTITLEMENTS = [^;]+;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g" "$PROJECT_FILE"
        fi
        echo "aps-environment = $APS"
        grep -c "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PROJECT_FILE"


    - &use_profiles
      name: Configure iOS signing
      script: |
        set -e
        xcode-project use-profiles

    - &fetch_app_store_signing
      name: Create or fetch App Store signing files
      script: |
        set -e
        keychain initialize
        # Bez privátního klíče nelze uložit distribuční certifikát.
        # Použijeme klíč ze secrets (CERTIFICATE_PRIVATE_KEY), jinak vygenerujeme nový.
        KEY_PATH=/tmp/cm_cert_key.pem
        if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
        else
          ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY_PATH" -q -N "" <<< y >/dev/null
          rm -f "$KEY_PATH.pub"
        fi
        chmod 600 "$KEY_PATH"
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_APP_STORE \
          --certificate-key "@file:$KEY_PATH" \
          --create
        keychain add-certificates

    - &fetch_adhoc_signing
      name: Create or fetch Ad Hoc signing files
      script: |
        set -e
        keychain initialize
        KEY_PATH=/tmp/cm_cert_key.pem
        if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
        else
          ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY_PATH" -q -N "" <<< y >/dev/null
          rm -f "$KEY_PATH.pub"
        fi
        chmod 600 "$KEY_PATH"
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_ADHOC \
          --certificate-key "@file:$KEY_PATH" \
          --create
        keychain add-certificates


    - &build_ipa
      name: Build IPA
      script: |
        set -e
        # Codemagic vždy poskytuje inkrementální BUILD_NUMBER; ASC dotaz je jen doplněk
        if [ -n "$APP_STORE_APPLE_ID" ]; then
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
        else
          LATEST=0
        fi
        NEXT=$((LATEST + 1))
        if [ -n "$BUILD_NUMBER" ] && [ "$BUILD_NUMBER" -gt "$NEXT" ]; then
          NEXT=$BUILD_NUMBER
        fi
        BUILD_NUMBER=$NEXT
        echo "Using build number $BUILD_NUMBER"
        cd ios/App
        agvtool new-marketing-version "${MARKETING_VERSION:-1.0.0}" || true
        agvtool new-version -all "$BUILD_NUMBER" || true
        cd -
        xcode-project build-ipa \
          --workspace "ios/App/App.xcworkspace" \
          --scheme "App"

workflows:
  ios-testflight:
    name: CHDP Garage iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"

    scripts:
      - *install_deps
      - *build_web
      - *prepare_ios
      - *set_bundle_id
      - *push_entitlements
      - *fetch_app_store_signing
      - *use_profiles
      - *build_ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-adhoc:
    name: CHDP Garage iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"

    scripts:
      - *install_deps
      - *build_web
      - *prepare_ios
      - *set_bundle_id
      - *push_entitlements
      - *fetch_adhoc_signing
      - *use_profiles
      - *build_ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-test:
    name: CHDP iOS Test
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"

    scripts:
      - name: Verify Codemagic configuration
        script: |
          set -e
          echo "CHDP CODEMAGIC CONFIGURATION TEST"
          node --version
          npm --version
          pwd
          echo "Bundle ID: $BUNDLE_ID"
          echo "CODEMAGIC CONFIGURATION OK"

    artifacts:
      - /tmp/xcodebuild_logs/*.log
