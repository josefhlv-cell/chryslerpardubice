      # ----------------------------------------------------------
      # 7. SET MARKETING VERSION
      # ----------------------------------------------------------

      - name: Set application version
        script: |
          set -e

          echo "=============================================="
          echo "SETTING MARKETING VERSION"
          echo "=============================================="

          cd ios/App

          agvtool new-marketing-version "$MARKETING_VERSION"

          cd "$CM_BUILD_DIR"

          echo ""
          echo "Marketing version:"
          echo "$MARKETING_VERSION"

      # ----------------------------------------------------------
      # 8. GET NEXT APP STORE BUILD NUMBER
      # ----------------------------------------------------------

      - name: Set automatic build number
        script: |
          set -e

          echo "=============================================="
          echo "SETTING APP STORE BUILD NUMBER"
          echo "=============================================="

          echo ""
          echo "Getting latest App Store Connect build..."

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID"
          )

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo ""
            echo "ERROR: Invalid build number returned:"
            echo "$LATEST_BUILD_NUMBER"
            exit 1
          fi

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo ""
          echo "Latest build number:"
          echo "$LATEST_BUILD_NUMBER"

          echo ""
          echo "New build number:"
          echo "$NEW_BUILD_NUMBER"

          cd ios/App

          agvtool new-version -all "$NEW_BUILD_NUMBER"

          cd "$CM_BUILD_DIR"

          echo ""
          echo "Build number configured successfully."

      # ----------------------------------------------------------
      # 9. FINAL SIGNING / VERSION VERIFICATION
      # ----------------------------------------------------------

      - name: Final signing and version verification
        script: |
          set -e

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "=============================================="
          echo "FINAL IOS VERIFICATION"
          echo "=============================================="

          echo ""
          echo "Bundle ID:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          echo ""
          echo "Code signing:"
          grep "CODE_SIGN" "$PROJECT_FILE" || true

          echo ""
          echo "Entitlements:"
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" || true

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Expected Marketing Version:"
          echo "$MARKETING_VERSION"

          echo ""
          echo "Xcode project:"
          ls -la ios/App/

          echo ""
          echo "Available schemes:"
          xcodebuild \
            -list \
            -project "ios/App/App.xcodeproj"

          echo ""
          echo "Final verification completed."

      # ----------------------------------------------------------
      # 10. BUILD IPA
      # ----------------------------------------------------------

      - name: Build IPA
        script: |
          set -e

          echo "=============================================="
          echo "BUILDING CHDP GARAGE IPA - APP STORE"
          echo "=============================================="

          PROJECT="$CM_BUILD_DIR/ios/App/App.xcodeproj"
          WORKSPACE="$CM_BUILD_DIR/ios/App/App.xcworkspace"
          SCHEME="App"

          echo ""
          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Scheme:"
          echo "$SCHEME"

          if [ -d "$WORKSPACE" ]; then

            echo ""
            echo "Xcode workspace detected."
            echo "Building using workspace..."

            xcode-project build-ipa \
              --workspace "$WORKSPACE" \
              --scheme "$SCHEME"

          else

            echo ""
            echo "No Xcode workspace detected."
            echo "Building directly from Xcode project..."

            xcode-project build-ipa \
              --project "$PROJECT" \
              --scheme "$SCHEME"

          fi

          echo ""
          echo "=============================================="
          echo "APP STORE IPA BUILD FINISHED"
          echo "=============================================="

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
