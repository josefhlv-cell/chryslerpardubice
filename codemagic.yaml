definitions:
  environment: &ios_environment
    xcode: latest
    node: 22
    vars:
      BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
      MARKETING_VERSION: "1.0.0"
      APP_STORE_APPLE_ID: "6807151165"
    ios_signing:
      distribution_type: app_store
      bundle_identifier: "cz.chryslerpardubice.chdpgarage"

workflows:
  ios-appstore:
    name: CHDP Garage – TestFlight & App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *ios_environment

    cache:
      cache_paths:
        - "$HOME/.npm"
        - "$HOME/Library/Caches/org.swift.swiftpm"

    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Test application
        script: |
          set -euo pipefail
          npm test -- --run

      - name: Build web application
        script: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Prepare Capacitor iOS project
        script: |
          set -euo pipefail

          # Capacitor 8 uses Swift Package Manager. Never create a Podfile or
          # require an .xcworkspace: doing so mixes two dependency systems and
          # breaks plugins that no longer publish CocoaPods podspecs.
          rm -rf ios
          npx cap add ios
          npx cap sync ios

          PROJECT="$CM_BUILD_DIR/ios/App/App.xcodeproj"
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          test -d "$PROJECT"
          test -f "$PROJECT/project.pbxproj"
          test -f "$PLIST"

          if [ -f "$CM_BUILD_DIR/ios/App/Podfile" ] || [ -d "$CM_BUILD_DIR/ios/App/App.xcworkspace" ]; then
            echo "ERROR: Unexpected CocoaPods files detected in Capacitor 8 project."
            exit 1
          fi

          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme App

      - name: Generate app icons
        script: |
          set -euo pipefail
          npx @capacitor/assets generate --ios

      - name: Configure iOS metadata and push notifications
        script: |
          set -euo pipefail
          PROJECT_FILE="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          ENTITLEMENTS="$CM_BUILD_DIR/ios/App/App/App.entitlements"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CHDP Garage" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string CHDP Garage" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"

          cat > "$ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF

          # Apply the stable Bundle ID and entitlement file to Debug and Release.
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$PROJECT_FILE"
          sed -i '' -E '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT_FILE"
          sed -i '' -E '/PRODUCT_BUNDLE_IDENTIFIER = cz\.chryslerpardubice\.chdpgarage;/a\
\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;' "$PROJECT_FILE"

          plutil -lint "$PLIST"
          plutil -lint "$ENTITLEMENTS"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PROJECT_FILE"

      - name: Configure signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"

      - name: Set version and automatic build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || printf '0')"
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*) LATEST_BUILD_NUMBER=0 ;;
          esac
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$NEW_BUILD_NUMBER"

          echo "Marketing version: $MARKETING_VERSION"
          echo "Build number: $NEW_BUILD_NUMBER"

      - name: Validate native project
        script: |
          set -euo pipefail
          PROJECT="$CM_BUILD_DIR/ios/App/App.xcodeproj"
          PROJECT_FILE="$PROJECT/project.pbxproj"

          test -d "$PROJECT"
          test ! -f "$CM_BUILD_DIR/ios/App/Podfile"
          test ! -d "$CM_BUILD_DIR/ios/App/App.xcworkspace"
          ! grep -q "app\.lovable\." "$PROJECT_FILE"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"

          xcodebuild -project "$PROJECT" -scheme App -configuration Release -showBuildSettings > /tmp/chdp-build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" /tmp/chdp-build-settings.txt
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" /tmp/chdp-build-settings.txt

      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true

  ios-test:
    name: CHDP iOS Configuration Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Verify Codemagic configuration
        script: |
          set -euo pipefail
          node --version
          npm --version
          test -f capacitor.config.ts
          grep -q "cz.chryslerpardubice.chdpgarage" capacitor.config.ts
          echo "CODEMAGIC CONFIGURATION OK"