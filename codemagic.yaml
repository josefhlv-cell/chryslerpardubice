definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

workflows:

  # ============================================================
  # CHDP GARAGE — iOS AD HOC
  # ============================================================

  ios-adhoc:
    name: CHDP Garage iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      # ----------------------------------------------------------
      # 1. INSTALL DEPENDENCIES
      # ----------------------------------------------------------

      - name: Install dependencies
        script: |
          set -e

          echo "=============================================="
          echo "INSTALLING NPM DEPENDENCIES"
          echo "=============================================="

          npm ci

      # ----------------------------------------------------------
      # 2. BUILD WEB APPLICATION
      # ----------------------------------------------------------

      - name: Build web application
        script: |
          set -e

          echo "=============================================="
          echo "BUILDING WEB APPLICATION"
          echo "=============================================="

          npm run build

      # ----------------------------------------------------------
      # 3. PREPARE CAPACITOR IOS
      # ----------------------------------------------------------

      - name: Prepare Capacitor iOS project
        script: |
          set -e

          echo "=============================================="
          echo "PREPARING CAPACITOR IOS"
          echo "=============================================="

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "Xcode project does not exist."
            echo "Creating Capacitor iOS project..."

            npx cap add ios
          else
            echo "Existing iOS Xcode project found."
          fi

          echo ""
          echo "Synchronizing Capacitor..."

          npx cap sync ios

          echo ""
          echo "Checking CocoaPods..."

          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile found."
            echo "Running pod install..."

            cd ios/App
            pod install
            cd "$CM_BUILD_DIR"

            echo "CocoaPods installation completed."
          else
            echo "No Podfile found."
            echo "Using Xcode project directly."
          fi

          echo ""
          echo "Capacitor iOS preparation completed."

      # ----------------------------------------------------------
      # 4. VERIFY IOS PROJECT
      # ----------------------------------------------------------

      - name: Verify iOS project
        script: |
          set -e

          echo "=============================================="
          echo "VERIFYING IOS PROJECT"
          echo "=============================================="

          PROJECT_DIR="ios/App/App.xcodeproj"
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Xcode project directory not found:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project file not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo ""
          echo "Xcode project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Workspace status:"

          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "App.xcworkspace exists."
            echo "Workspace can be used."
          else
            echo "App.xcworkspace does not exist."
            echo "This is OK — using App.xcodeproj."
          fi

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          if ! grep -q "$BUNDLE_ID" "$PROJECT_FILE"; then
            echo ""
            echo "ERROR: Expected Bundle ID was not found."
            echo "Expected:"
            echo "$BUNDLE_ID"
            exit 1
          fi

          echo ""
          echo "Checking Xcode scheme..."

          xcodebuild \
            -list \
            -project "$PROJECT_DIR"

          echo ""
          echo "iOS project verification: OK"

      # ----------------------------------------------------------
      # 5. CONFIGURE IOS SIGNING
      # ----------------------------------------------------------

      - name: Configure iOS signing
        script: |
          set -e

          echo "=============================================="
          echo "CONFIGURING IOS CODE SIGNING"
          echo "=============================================="

          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"

          echo ""
          echo "Code signing configuration: OK"

      # ----------------------------------------------------------
      # 6. CONFIGURE INFO.PLIST
      # ----------------------------------------------------------

      - name: Configure Info.plist
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          echo "=============================================="
          echo "CONFIGURING INFO.PLIST"
          echo "=============================================="

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSBluetoothAlwaysUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSBluetoothPeripheralUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocationWhenInUseUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." \
            "$PLIST"

          echo ""
          echo "Validating Info.plist..."

          plutil -lint "$PLIST"

          echo ""
          echo "Info.plist verification: OK"

      # ----------------------------------------------------------
      # 7. SET MARKETING VERSION
      # ----------------------------------------------------------

      - name: Set marketing version
        script: |
          set -e

          echo "=============================================="
          echo "SETTING MARKETING VERSION"
          echo "=============================================="

          cd ios/App

          agvtool new-marketing-version "$MARKETING_VERSION"

          cd "$CM_BUILD_DIR"

          echo ""
          echo "Marketing version:"
          echo "$MARKETING_VERSION"

      # ----------------------------------------------------------
      # 8. SET AD HOC BUILD NUMBER
      # ----------------------------------------------------------

      - name: Set build number
        script: |
          set -e

          echo "=============================================="
          echo "SETTING AD HOC BUILD NUMBER"
          echo "=============================================="

          NEW_BUILD_NUMBER=$(date +%Y%m%d%H%M)

          echo "New build number:"
          echo "$NEW_BUILD_NUMBER"

          cd ios/App

          agvtool new-version -all "$NEW_BUILD_NUMBER"

          cd "$CM_BUILD_DIR"

          echo ""
          echo "Build number configured."

      # ----------------------------------------------------------
      # 9. FINAL IOS DIAGNOSTICS
      # ----------------------------------------------------------

      - name: Final iOS diagnostics
        script: |
          set -e

          echo "=============================================="
          echo "FINAL IOS PROJECT DIAGNOSTICS"
          echo "=============================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Xcode projects:"
          find ios -maxdepth 4 -type d -name "*.xcodeproj" -print

          echo ""
          echo "Xcode workspaces:"
          find ios -maxdepth 4 -type d -name "*.xcworkspace" -print || true

          echo ""
          echo "iOS App directory:"
          ls -la ios/App/

          echo ""
          echo "Bundle IDs:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/App/App.xcodeproj/project.pbxproj || true

          echo ""
          echo "Available schemes:"
          xcodebuild \
            -list \
            -project "ios/App/App.xcodeproj"

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Diagnostics completed."

      # ----------------------------------------------------------
      # 10. BUILD IPA
      # ----------------------------------------------------------

      - name: Build IPA
        script: |
          set -e

          echo "=============================================="
          echo "BUILDING CHDP GARAGE IPA - AD HOC"
          echo "=============================================="

          PROJECT="$CM_BUILD_DIR/ios/App/App.xcodeproj"
          WORKSPACE="$CM_BUILD_DIR/ios/App/App.xcworkspace"
          SCHEME="App"

          echo ""
          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Scheme:"
          echo "$SCHEME"

          if [ -d "$WORKSPACE" ]; then

            echo ""
            echo "Xcode workspace detected."
            echo "Building using workspace..."

            xcode-project build-ipa \
              --workspace "$WORKSPACE" \
              --scheme "$SCHEME"

          else

            echo ""
            echo "No Xcode workspace detected."
            echo "Building directly from Xcode project..."

            xcode-project build-ipa \
              --project "$PROJECT" \
              --scheme "$SCHEME"

          fi

          echo ""
          echo "=============================================="
          echo "AD HOC IPA BUILD FINISHED"
          echo "=============================================="

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log


  # ============================================================
  # CHDP GARAGE — iOS APP STORE / TESTFLIGHT
  # ============================================================

  ios-appstore:
    name: CHDP Garage iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: chdpgarage

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "6807151165"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      # ----------------------------------------------------------
      # 1. INSTALL DEPENDENCIES
      # ----------------------------------------------------------

      - name: Install dependencies
        script: |
          set -e

          echo "=============================================="
          echo "INSTALLING NPM DEPENDENCIES"
          echo "=============================================="

          npm ci

      # ----------------------------------------------------------
      # 2. BUILD WEB APPLICATION
      # ----------------------------------------------------------

      - name: Build web application
        script: |
          set -e

          echo "=============================================="
          echo "BUILDING WEB APPLICATION"
          echo "=============================================="

          npm run build

      # ----------------------------------------------------------
      # 3. PREPARE CAPACITOR IOS
      # ----------------------------------------------------------

      - name: Prepare Capacitor iOS project
        script: |
          set -e

          echo "=============================================="
          echo "PREPARING CAPACITOR IOS"
          echo "=============================================="

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "Xcode project does not exist."
            echo "Creating Capacitor iOS project..."

            npx cap add ios
          else
            echo "Existing iOS Xcode project found."
          fi

          echo ""
          echo "Synchronizing Capacitor..."

          npx cap sync ios

          echo ""
          echo "Checking CocoaPods..."

          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile found."
            echo "Running pod install..."

            cd ios/App
            pod install
            cd "$CM_BUILD_DIR"

            echo "CocoaPods installation completed."
          else
            echo "No Podfile found."
            echo "Using Xcode project directly."
          fi

          echo ""
          echo "Capacitor iOS preparation completed."

      # ----------------------------------------------------------
      # 4. VERIFY IOS PROJECT
      # ----------------------------------------------------------

      - name: Verify iOS project
        script: |
          set -e

          echo "=============================================="
          echo "VERIFYING IOS PROJECT"
          echo "=============================================="

          PROJECT_DIR="ios/App/App.xcodeproj"
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Xcode project directory not found:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project file not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo ""
          echo "Xcode project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Workspace status:"

          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "App.xcworkspace exists."
            echo "Workspace can be used."
          else
            echo "App.xcworkspace does not exist."
            echo "This is OK — using App.xcodeproj."
          fi

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          if ! grep -q "$BUNDLE_ID" "$PROJECT_FILE"; then
            echo ""
            echo "ERROR: Expected Bundle ID was not found."
            echo "Expected:"
            echo "$BUNDLE_ID"
            exit 1
          fi

          echo ""
          echo "Checking Xcode scheme..."

          xcodebuild \
            -list \
            -project "$PROJECT_DIR"

          echo ""
          echo "iOS project verification: OK"

      # ----------------------------------------------------------
      # 5. CONFIGURE IOS SIGNING
      # ----------------------------------------------------------

      - name: Configure iOS signing
        script: |
          set -e

          echo "=============================================="
          echo "CONFIGURING IOS CODE SIGNING"
          echo "=============================================="

          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"

          echo ""
          echo "Code signing configuration: OK"

      # ----------------------------------------------------------
      # 6. CONFIGURE INFO.PLIST
      # ----------------------------------------------------------

      - name: Configure Info.plist
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          echo "=============================================="
          echo "CONFIGURING INFO.PLIST"
          echo "=============================================="

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSBluetoothAlwaysUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSBluetoothPeripheralUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocationWhenInUseUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." \
            "$PLIST"

          echo ""
          echo "Validating Info.plist..."

