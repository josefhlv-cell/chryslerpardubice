definitions:
  environment: &ios_environment
    xcode: latest
    node: 22
    vars:
      BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
      MARKETING_VERSION: "1.0.0"
      APP_STORE_APPLE_ID: "6807151165"
    ios_signing:
      distribution_type: app_store
      bundle_identifier: "cz.chryslerpardubice.chdpgarage"

workflows:
  ios-appstore:
    name: CHDP Garage – TestFlight & App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: chdpgarage

    environment:
      <<: *ios_environment

    cache:
      cache_paths:
        - "$HOME/.npm"
        - "$HOME/Library/Caches/org.swift.swiftpm"

    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund || {
            echo "npm ci failed (lockfile out of sync) – recovering with npm install."
            npm install --no-audit --no-fund
          }


      - name: Test application
        script: |
          set -euo pipefail
          npm test -- --run

      - name: Build web application
        script: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Prepare Capacitor iOS project
        script: |
          set -euo pipefail

          # Capacitor 8 uses Swift Package Manager. Never create a Podfile or
          # require an .xcworkspace: doing so mixes two dependency systems and
          # breaks plugins that no longer publish CocoaPods podspecs.
          rm -rf ios
          npx cap add ios
          npx cap sync ios

          PROJECT="$CM_BUILD_DIR/ios/App/App.xcodeproj"
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          test -d "$PROJECT"
          test -f "$PROJECT/project.pbxproj"
          test -f "$PLIST"

          if [ -f "$CM_BUILD_DIR/ios/App/Podfile" ] || [ -d "$CM_BUILD_DIR/ios/App/App.xcworkspace" ]; then
            echo "ERROR: Unexpected CocoaPods files detected in Capacitor 8 project."
            exit 1
          fi

          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme App

      - name: Ensure AppDelegate forwards APNs callbacks
        script: |
          set -euo pipefail
          DELEGATE="$CM_BUILD_DIR/ios/App/App/AppDelegate.swift"
          SRC="$CM_BUILD_DIR/ios-ci/AppDelegate.swift"
          test -f "$DELEGATE"
          test -f "$SRC"
          echo "=== AppDelegate before overwrite ==="
          cat "$DELEGATE"
          cp "$SRC" "$DELEGATE"
          grep -q "import Capacitor" "$DELEGATE"
          grep -q "didRegisterForRemoteNotificationsWithDeviceToken" "$DELEGATE"
          grep -q "didFailToRegisterForRemoteNotificationsWithError" "$DELEGATE"
          grep -q "capacitorDidRegisterForRemoteNotifications" "$DELEGATE"
          if ! awk '
            /class AppDelegate/ { in_class=1 }
            in_class && /didRegisterForRemoteNotificationsWithDeviceToken/ { found=1 }
            in_class && /^}$/ { if (found) { ok=1; exit 0 } }
            END { exit ok ? 0 : 1 }
          ' "$DELEGATE"; then
            echo "ERROR: APNs register method not inside AppDelegate class"
            exit 1
          fi
          echo "AppDelegate class body OK"
          PKG="$CM_BUILD_DIR/ios/App/CapApp-SPM/Package.swift"
          test -f "$PKG"
          echo "=== CapApp-SPM Package.swift ==="
          cat "$PKG"
          grep -qi "PushNotifications" "$PKG" \
            || { echo "ERROR: @capacitor/push-notifications missing from CapApp-SPM Package.swift after cap sync"; exit 1; }
          echo "=== AppDelegate after overwrite ==="
          cat "$DELEGATE"
          echo "APNs FORWARDING OK"


      - name: Generate app icons
        script: |
          set -euo pipefail
          npx @capacitor/assets generate --ios

      - name: Configure iOS metadata and push notifications
        script: |
          set -euo pipefail
          PROJECT_FILE="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          ENTITLEMENTS="$CM_BUILD_DIR/ios/App/App/App.entitlements"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CHDP Garage" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string CHDP Garage" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          # ASC warning 90683: SDKs may reference Always+WhenInUse APIs even if we only use WhenInUse.
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          # Export compliance: aplikace nepoužívá neosvobozené šifrování.
          # Bez tohoto klíče Apple odmítne odeslání buildu do TestFlight (422).
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>aps-environment</key>' \
            '  <string>production</string>' \
            '</dict>' \
            '</plist>' > "$ENTITLEMENTS"

          # Apply the stable Bundle ID and entitlement file to Debug and Release.
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$PROJECT_FILE"
          sed -i '' -E '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT_FILE"
          perl -0pi -e 's|(PRODUCT_BUNDLE_IDENTIFIER = cz\.chryslerpardubice\.chdpgarage;)|$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PROJECT_FILE"

          # Universal (iPhone + iPad). Capacitor default is already "1,2";
          # keep it explicit so a future template change cannot silently drop iPad support.
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?[0-9,]+"?;/TARGETED_DEVICE_FAMILY = "1,2";/g' "$PROJECT_FILE"
          if ! grep -qE 'TARGETED_DEVICE_FAMILY = "?1,2"?;' "$PROJECT_FILE"; then
            perl -0pi -e 's|(PRODUCT_BUNDLE_IDENTIFIER = cz\.chryslerpardubice\.chdpgarage;)|$1\n\t\t\t\tTARGETED_DEVICE_FAMILY = "1,2";|g' "$PROJECT_FILE"
          fi

          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$PLIST"

          # iPad orientations (required when UIDeviceFamily includes iPad).
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          # Deep link / OAuth return scheme (must match capacitor.config.ts ios.scheme).
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string cz.chryslerpardubice.chdpgarage" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string chdp-servis" "$PLIST"

          # Fail fast if Capacitor config lost desktop iPad mode.
          grep -q "preferredContentMode: 'desktop'" "$CM_BUILD_DIR/capacitor.config.ts" \
            || grep -q 'preferredContentMode: "desktop"' "$CM_BUILD_DIR/capacitor.config.ts" \
            || { echo "ERROR: preferredContentMode must be desktop for iPad layout"; exit 1; }

          plutil -lint "$PLIST"
          plutil -lint "$ENTITLEMENTS"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PROJECT_FILE"
          grep -qE 'TARGETED_DEVICE_FAMILY = "?1,2"?;' "$PROJECT_FILE"

      - name: Configure signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"

          # use-profiles can rewrite CODE_SIGN_* — re-assert entitlements for Push.
          PROJECT_FILE="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          ENTITLEMENTS="$CM_BUILD_DIR/ios/App/App/App.entitlements"
          test -f "$ENTITLEMENTS"
          echo "=== App.entitlements on disk ==="
          cat "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENTITLEMENTS" | grep -qx "production"
          sed -i '' -E '/CODE_SIGN_ENTITLEMENTS = /d' "$PROJECT_FILE"
          perl -0pi -e 's|(PRODUCT_BUNDLE_IDENTIFIER = cz\.chryslerpardubice\.chdpgarage;)|$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PROJECT_FILE"
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PROJECT_FILE"

      - name: Set version and automatic build number
        script: |
          set -euo pipefail
          # Take the highest build number from BOTH App Store and TestFlight.
          # get-latest-app-store-build-number alone ignores TestFlight-only
          # builds, which caused the duplicate CFBundleVersion=4 upload error.
          LATEST_APP_STORE="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || printf '0')"
          LATEST_TESTFLIGHT="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || printf '0')"
          case "$LATEST_APP_STORE" in ''|*[!0-9]*) LATEST_APP_STORE=0 ;; esac
          case "$LATEST_TESTFLIGHT" in ''|*[!0-9]*) LATEST_TESTFLIGHT=0 ;; esac
          if [ "$LATEST_TESTFLIGHT" -gt "$LATEST_APP_STORE" ]; then
            LATEST_BUILD_NUMBER="$LATEST_TESTFLIGHT"
          else
            LATEST_BUILD_NUMBER="$LATEST_APP_STORE"
          fi
          # Safety floor: never go below already-used build 4.
          if [ "$LATEST_BUILD_NUMBER" -lt 4 ]; then LATEST_BUILD_NUMBER=4; fi
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest App Store build: $LATEST_APP_STORE"
          echo "Latest TestFlight build: $LATEST_TESTFLIGHT"

          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$NEW_BUILD_NUMBER"

          echo "Marketing version: $MARKETING_VERSION"
          echo "Build number: $NEW_BUILD_NUMBER"

      - name: Validate native project
        script: |
          set -euo pipefail
          PROJECT="$CM_BUILD_DIR/ios/App/App.xcodeproj"
          PROJECT_FILE="$PROJECT/project.pbxproj"

          test -d "$PROJECT"
          test ! -f "$CM_BUILD_DIR/ios/App/Podfile"
          test ! -d "$CM_BUILD_DIR/ios/App/App.xcworkspace"
          ! grep -q "app\.lovable\." "$PROJECT_FILE"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"

          xcodebuild -project "$PROJECT" -scheme App -configuration Release -showBuildSettings > /tmp/chdp-build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" /tmp/chdp-build-settings.txt
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" /tmp/chdp-build-settings.txt
          # Universal: iPhone (1) + iPad (2).
          grep -E 'TARGETED_DEVICE_FAMILY' /tmp/chdp-build-settings.txt | tee /tmp/chdp-device-family.txt
          grep -Eq 'TARGETED_DEVICE_FAMILY = "?1,2"?' /tmp/chdp-device-family.txt \
            || { echo "ERROR: expected TARGETED_DEVICE_FAMILY 1,2"; cat /tmp/chdp-device-family.txt; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$CM_BUILD_DIR/ios/App/App/Info.plist" | tee /tmp/chdp-ui-device-family.txt
          grep -q "1" /tmp/chdp-ui-device-family.txt
          grep -q "2" /tmp/chdp-ui-device-family.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$CM_BUILD_DIR/ios/App/App/Info.plist" | grep -q "chdp-servis"

      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App \
            --config Release

      - name: Verify push entitlements in IPA
        script: |
          set -euo pipefail
          IPA=$(ls -1 "$CM_BUILD_DIR"/build/ios/ipa/*.ipa | head -1)
          test -f "$IPA"
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          APP=$(echo "$TMP"/Payload/*.app)
          test -d "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/chdp-entitlements.plist 2>/dev/null || true
          echo "=== Signed entitlements ==="
          plutil -p /tmp/chdp-entitlements.plist || cat /tmp/chdp-entitlements.plist
          # Production TestFlight/App Store builds must embed aps-environment=production
          /usr/libexec/PlistBuddy -c "Print :application-identifier" /tmp/chdp-entitlements.plist || true
          APS=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" /tmp/chdp-entitlements.plist 2>/dev/null || true)
          echo "aps-environment=$APS"
          if [ "$APS" != "production" ]; then
            echo "ERROR: IPA missing aps-environment=production (push will hang / no Notifications in Settings)."
            exit 1
          fi
          echo "PUSH ENTITLEMENTS OK"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Nahrání do App Store Connect + TestFlight je plně automatické.
        submit_to_testflight: true
        # App Store review se NEODESÍLÁ automaticky.
        # Důvod: pokud pro verzi 1.0.0 už existuje otevřené review submission,
        # Apple vrací 409 a celá stavba spadne, i když build i TestFlight prošly.
        # Review se spouští ručně v App Store Connect (tlačítko "Add for Review").
        submit_to_app_store: false


  ios-test:
    name: CHDP iOS Configuration Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Verify Codemagic configuration
        script: |
          set -euo pipefail
          node --version
          npm --version
          test -f capacitor.config.ts
          grep -q "cz.chryslerpardubice.chdpgarage" capacitor.config.ts
          grep -q "preferredContentMode: 'desktop'" capacitor.config.ts || grep -q 'preferredContentMode: "desktop"' capacitor.config.ts
          grep -q "scheme: 'chdp-servis'" capacitor.config.ts || grep -q 'scheme: "chdp-servis"' capacitor.config.ts
          echo "CODEMAGIC CONFIGURATION OK"
