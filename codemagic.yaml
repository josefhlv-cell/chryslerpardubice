definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

  common_scripts:
    - &install_deps
      name: Install dependencies
      script: |
        set -e
        npm ci

    - &build_web
      name: Build web application
      script: |
        set -e
        npm run build

    - &prepare_ios
      name: Prepare iOS project (Capacitor)
      script: |
        set -e
        if [ ! -d "ios" ]; then
          npx cap add ios
        fi
        npx cap sync ios

    - &set_bundle_id
      name: Apply bundle identifier
      script: |
        set -e
        echo "Target bundle ID: $BUNDLE_ID"
        PROJECT_FILE=$(find ios -name "project.pbxproj" -type f | head -1)
        if [ -z "$PROJECT_FILE" ]; then
          echo "ERROR: Xcode project not found."
          exit 1
        fi
        # Normalise any previously generated identifier to the signed one
        sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$PROJECT_FILE"
        grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PROJECT_FILE"
        echo "Bundle ID applied."

    - &use_profiles
      name: Configure iOS signing
      script: |
        set -e
        xcode-project use-profiles

    - &build_ipa
      name: Build IPA
      script: |
        set -e
        BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
        echo "Using build number $BUILD_NUMBER"
        cd ios/App
        agvtool new-version -all "$BUILD_NUMBER" || true
        cd -
        xcode-project build-ipa \
          --workspace "ios/App/App.xcworkspace" \
          --scheme "App"

workflows:
  ios-testflight:
    name: CHDP Garage iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: "app.lovable.c6d932101224420590deeec3ccc6923f"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "app.lovable.c6d932101224420590deeec3ccc6923f"

    scripts:
      - *install_deps
      - *build_web
      - *prepare_ios
      - *set_bundle_id
      - *use_profiles
      - *build_ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-adhoc:
    name: CHDP Garage iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: "app.lovable.c6d932101224420590deeec3ccc6923f"
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "app.lovable.c6d932101224420590deeec3ccc6923f"

    scripts:
      - *install_deps
      - *build_web
      - *prepare_ios
      - *set_bundle_id
      - *use_profiles
      - *build_ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-test:
    name: CHDP iOS Test
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: "app.lovable.c6d932101224420590deeec3ccc6923f"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "app.lovable.c6d932101224420590deeec3ccc6923f"

    scripts:
      - name: Verify Codemagic configuration
        script: |
          set -e
          echo "CHDP CODEMAGIC CONFIGURATION TEST"
          node --version
          npm --version
          pwd
          echo "Bundle ID: $BUNDLE_ID"
          echo "CODEMAGIC CONFIGURATION OK"

    artifacts:
      - /tmp/xcodebuild_logs/*.log
