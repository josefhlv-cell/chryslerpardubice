workflows:
  android-workflow:
    name: Android Build (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
      vars:
        PACKAGE_NAME: "app.lovable.c6d932101224420590deeec3ccc6923f"
    scripts:
      - name: Install npm dependencies (clean)
        script: |
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed, retrying with npm install to recover from an out-of-sync lockfile in CI."
            npm install --legacy-peer-deps --no-audit --no-fund
          }
      - name: Install required Android SDK packages
        script: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets (Vite)
        script: |
          npm run build
      - name: Sync Capacitor (Android)
        script: |
          npx cap sync android
      - name: Validate Android project
        script: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:tasks --no-daemon --stacktrace
      - name: Build Android Debug APK and Release AAB
        script: |
          ./android/gradlew -p android :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace --warning-mode all
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/reports/**/*

  ios-testflight-workflow:
    name: iOS TestFlight Build (signed)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Garáž CHDP"
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: CHDP.OBD.CHRYSL.VLINK
    scripts:
      - name: Install npm dependencies (clean)
        script: |
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed, retrying with npm install to recover from an out-of-sync lockfile in CI."
            npm install --legacy-peer-deps --no-audit --no-fund
          }
      - name: Build web assets (Vite)
        script: |
          npm run build
      - name: Add iOS platform if missing (SPM)
        script: |
          set -e
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "iOS project missing — adding fresh (SPM)"
            rm -rf ios
            npx cap add ios --packagemanager SPM
          else
            echo "iOS project already present"
          fi
      - name: Patch iOS Info.plist permissions
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera se používá pro OCR skenování VIN a SPZ.'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Kamera se používá pro OCR skenování VIN a SPZ.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Lokalizace je vyžadována pro Bluetooth Low Energy skenování.'" "$PLIST" 2>/dev/null || true
      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files CHDP.OBD.CHRYSL.VLINK --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true