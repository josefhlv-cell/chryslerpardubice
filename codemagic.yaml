definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

workflows:
  ios-adhoc:
    name: CHDP Garage iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      - name: Install dependencies
        script: |
          set -e
          echo "======================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "======================================"
          npm ci

      - name: Build web application
        script: |
          set -e
          echo "======================================"
          echo "BUILDING WEB APPLICATION"
          echo "======================================"
          npm run build

      - name: Prepare Capacitor iOS project
        script: |
          set -e
          echo "======================================"
          echo "PREPARING CAPACITOR IOS"
          echo "======================================"

          if [ ! -d "ios" ]; then
            echo "iOS directory does not exist."
            echo "Creating Capacitor iOS project..."
            npx cap add ios
          else
            echo "iOS directory already exists, skipping cap add."
          fi

          echo ""
          echo "Synchronizing Capacitor..."
          npx cap sync ios

          echo ""
          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile found - installing CocoaPods dependencies..."
            cd ios/App
            pod install --repo-update
            cd "$CM_BUILD_DIR"
            echo "✓ CocoaPods installed"
          else
            echo "Podfile not found — Capacitor uses Swift Package Manager, continuing without CocoaPods."
          fi

          echo ""
          echo "✓ Capacitor iOS preparation: OK"

      - name: Generate app icons
        script: |
          set -e
          echo "======================================"
          echo "GENERATING APP ICONS"
          echo "======================================"
          npx @capacitor/assets generate --ios

      - name: Verify iOS project
        script: |
          set -e
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "VERIFYING IOS PROJECT"
          echo "======================================"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo ""
          echo "Workspace present:"
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "✓ ios/App/App.xcworkspace (will use --workspace)"
          else
            echo "Not present — SPM-only project (will use --project)"
          fi

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" | head -5

          echo ""
          echo "Checking if Bundle ID is configured..."
          if ! grep -q "$BUNDLE_ID" "$PROJECT_FILE"; then
            echo "WARNING: Expected Bundle ID was not found in project.pbxproj"
            echo "This may need to be configured manually in Xcode."
            echo "Attempting to continue..."
          else
            echo "✓ Bundle ID found in project"
          fi

          echo ""
          echo "✓ Xcode project verification: OK"

      - name: Configure iOS signing
        script: |
          set -e
          echo "======================================"
          echo "CONFIGURING IOS CODE SIGNING"
          echo "======================================"
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"
          echo ""
          echo "✓ Code signing configuration: OK"

      - name: Configure Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"

          echo "======================================"
          echo "CONFIGURING INFO.PLIST"
          echo "======================================"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          echo ""
          echo "Validating Info.plist..."
          plutil -lint "$PLIST"
          echo ""
          echo "✓ Info.plist verification: OK"

      - name: Set marketing version
        script: |
          set -e
          echo "======================================"
          echo "SETTING MARKETING VERSION"
          echo "======================================"
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          cd "$CM_BUILD_DIR"
          echo ""
          echo "Marketing version: $MARKETING_VERSION"

      - name: Set build number
        script: |
          set -e
          echo "======================================"
          echo "SETTING BUILD NUMBER (timestamp-based)"
          echo "======================================"
          NEW_BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "New build number: $NEW_BUILD_NUMBER"
          cd ios/App
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          cd "$CM_BUILD_DIR"

      - name: Build IPA
        script: |
          set -e
          echo "======================================"
          echo "BUILDING CHDP GARAGE IPA (AD HOC)"
          echo "======================================"

          SCHEME="App"

          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Using workspace build."
            xcode-project build-ipa \
              --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
              --scheme "$SCHEME"
          else
            echo "No workspace found — building from .xcodeproj (SPM-only project)."
            xcode-project build-ipa \
              --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
              --scheme "$SCHEME"
          fi

          echo ""
          echo "======================================"
          echo "IPA BUILD FINISHED SUCCESSFULLY"
          echo "======================================"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-appstore:
    name: CHDP Garage iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "6807151165"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      - name: Install dependencies
        script: |
          set -e
          echo "======================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "======================================"
          npm ci

      - name: Build web application
        script: |
          set -e
          echo "======================================"
          echo "BUILDING WEB APPLICATION"
          echo "======================================"
          npm run build

      - name: Prepare Capacitor iOS project
        script: |
          set -e
          echo "======================================"
          echo "PREPARING CAPACITOR IOS"
          echo "======================================"

          if [ ! -d "ios" ]; then
            echo "iOS directory does not exist."
            echo "Creating Capacitor iOS project..."
            npx cap add ios
          else
            echo "iOS directory already exists, skipping cap add."
          fi

          echo ""
          echo "Synchronizing Capacitor..."
          npx cap sync ios

          echo ""
          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile found - installing CocoaPods dependencies..."
            cd ios/App
            pod install --repo-update
            cd "$CM_BUILD_DIR"
            echo "✓ CocoaPods installed"
          else
            echo "Podfile not found — Capacitor uses Swift Package Manager, continuing without CocoaPods."
          fi

          echo ""
          echo "✓ Capacitor iOS preparation: OK"

      - name: Generate app icons
        script: |
          set -e
          echo "======================================"
          echo "GENERATING APP ICONS"
          echo "======================================"
          npx @capacitor/assets generate --ios

      - name: Verify iOS project
        script: |
          set -e
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "VERIFYING IOS PROJECT"
          echo "======================================"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo ""
          echo "Workspace present:"
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "✓ ios/App/App.xcworkspace (will use --workspace)"
          else
            echo "Not present — SPM-only project (will use --project)"
          fi

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" | head -5

          echo ""
          echo "Checking if Bundle ID is configured..."
          if ! grep -q "$BUNDLE_ID" "$PROJECT_FILE"; then
            echo "WARNING: Expected Bundle ID was not found in project.pbxproj"
            echo "This may need to be configured manually in Xcode."
            echo "Attempting to continue..."
          else
            echo "✓ Bundle ID found in project"
          fi

          echo ""
          echo "✓ Xcode project verification: OK"

      - name: Configure iOS signing
        script: |
          set -e
          echo "======================================"
          echo "CONFIGURING IOS CODE SIGNING"
          echo "======================================"
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"
          echo ""
          echo "✓ Code signing configuration: OK"

      - name: Configure Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"

          echo "======================================"
          echo "CONFIGURING INFO.PLIST"
          echo "======================================"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          echo ""
          echo "Validating Info.plist..."
          plutil -lint "$PLIST"
          echo ""
          echo "✓ Info.plist verification: OK"

      - name: Set application version
        script: |
          set -e
          echo "======================================"
          echo "SETTING MARKETING VERSION"
          echo "======================================"
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          cd "$CM_BUILD_DIR"
          echo ""
          echo "Marketing version: $MARKETING_VERSION"

      - name: Set automatic build number
        script: |
          set -e
          echo "======================================"
          echo "SETTING BUILD NUMBER"
          echo "======================================"

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0"
          )

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=0
          fi

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo ""
          echo "Latest build number: $LATEST_BUILD_NUMBER"
          echo "New build number: $NEW_BUILD_NUMBER"

          cd ios/App
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          cd "$CM_BUILD_DIR"

          echo ""
          echo "✓ Build number configured successfully."

      - name: Final signing and version verification
        script: |
          set -e
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "FINAL IOS VERIFICATION"
          echo "======================================"

          echo ""
          echo "Bundle ID:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" | head -5

          echo ""
          echo "Code signing:"
          grep "CODE_SIGN" "$PROJECT_FILE" | head -5

          echo ""
          echo "Entitlements:"
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" || echo "No entitlements found"

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Expected Marketing Version:"
          echo "$MARKETING_VERSION"

          echo ""
          echo "✓ Verification completed."

      - name: Build IPA
        script: |
          set -e
          echo "======================================"
          echo "BUILDING CHDP GARAGE IPA"
          echo "======================================"

          SCHEME="App"

          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Using workspace build."
            xcode-project build-ipa \
              --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
              --scheme "$SCHEME"
          else
            echo "No workspace found — building from .xcodeproj (SPM-only project)."
            xcode-project build-ipa \
              --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
              --scheme "$SCHEME"
          fi

          echo ""
          echo "======================================"
          echo "IPA BUILD FINISHED SUCCESSFULLY"
          echo "======================================"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
