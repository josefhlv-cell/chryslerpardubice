workflows:
  ios-test:
    name: CHDP iOS Test
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Garáž CHDP"
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "app.lovable.c6d932101224420590deeec3ccc6923f"
    scripts:
      - name: Verify Codemagic configuration
        script: |
          set -e
          echo "=========================================="
          echo "CHDP CODEMAGIC CONFIGURATION TEST"
          echo "=========================================="
          echo "Node:"
          node --version
          echo "npm:"
          npm --version
          echo "Build directory:"
          pwd
          echo "Bundle ID:"
          echo "app.lovable.c6d932101224420590deeec3ccc6923f"
          echo "App Store Connect integration:"
          echo "Garáž CHDP"
          echo "CODEMAGIC CONFIGURATION OK"
    artifacts:
      - /tmp/xcodebuild_logs/*.log
