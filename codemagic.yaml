workflows:

  # ============================================================
  # ANDROID
  # ============================================================

  android-workflow:
    name: Android Build (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21
      node: 22
      vars:
        PACKAGE_NAME: "app.lovable.c6d932101224420590deeec3ccc6923f"

    scripts:

      - name: Install npm dependencies
        script: |
          set -e
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Android SDK
        script: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build web application
        script: |
          set -e
          npm run build

      - name: Generate Android icons
        script: |
          set -e

          npm install @capacitor/assets --save-dev

          npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        script: |
          set -e

          npx cap sync android

      - name: Validate Android project
        script: |
          set -e

          chmod +x android/gradlew

          ./android/gradlew \
            -p android \
            :app:tasks \
            --no-daemon \
            --stacktrace

      - name: Build Android APK and AAB
        script: |
          set -e

          ./android/gradlew \
            -p android \
            :app:assembleDebug \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/reports/**/*


  # ============================================================
  # IOS / TESTFLIGHT
  # ============================================================

  ios-testflight-workflow:

    name: iOS TestFlight Build

    max_build_duration: 90

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Garáž CHDP"

    environment:

      xcode: latest

      node: 22

      # ========================================================
      # IMPORTANT:
      # DO NOT specify CHDP_DIST_PUSH here.
      #
      # Codemagic will select the matching App Store
      # distribution certificate and provisioning profile
      # for this Bundle ID.
      # ========================================================

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "app.lovable.c6d932101224420590deeec3ccc6923f"


    scripts:

      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install npm dependencies
        script: |
          set -e

          npm --version

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            || npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund


      # ========================================================
      # BUILD WEB
      # ========================================================

      - name: Build web application
        script: |
          set -e

          npm run build


      # ========================================================
      # CAPACITOR ASSETS
      # ========================================================

      - name: Generate iOS icons
        script: |
          set -e

          npm install @capacitor/assets --save-dev

          npx capacitor-assets generate \
            --ios \
            --assetPath resources


      # ========================================================
      # CREATE IOS PLATFORM IF MISSING
      # ========================================================

      - name: Ensure iOS platform exists
        script: |
          set -e

          if [ ! -d "ios/App/App.xcodeproj" ]; then

            echo "iOS project missing."
            echo "Creating iOS project..."

            rm -rf ios

            npx cap add ios --packagemanager SPM

          else

            echo "Existing iOS project found."

          fi


      # ========================================================
      # CAPACITOR SYNC
      # ========================================================

      - name: Sync Capacitor iOS
        script: |
          set -e

          npx cap sync ios


      # ========================================================
      # VERIFY ICONS
      # ========================================================

      - name: Verify iOS AppIcon
        script: |
          set -e

          echo "Checking resources..."

          ls -lah resources || true

          echo "Checking source icons..."

          file resources/icon.png || true
          file resources/icon-only.png || true

          echo "Checking generated AppIcon..."

          APPICON="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -d "$APPICON" ]; then
            echo "ERROR: AppIcon.appiconset not found"
            exit 1
          fi

          ls -lah "$APPICON"

          echo "Contents.json:"

          cat "$APPICON/Contents.json"

          echo "Generated PNG files:"

          find "$APPICON" \
            -maxdepth 1 \
            -iname "*.png" \
            -print


      # ========================================================
      # APNs CALLBACKS
      # ========================================================

      - name: Patch AppDelegate for APNs callbacks
        script: |
          set -e

          APP_DELEGATE="ios/App/App/AppDelegate.swift"

          echo "Checking AppDelegate..."

          if [ ! -f "$APP_DELEGATE" ]; then
            echo "ERROR: AppDelegate.swift not found"
            exit 1
          fi

          if grep -q "capacitorDidRegisterForRemoteNotifications" "$APP_DELEGATE"; then

            echo "APNs callbacks already present."

          else

            python3 <<'PY'

          from pathlib import Path

          path = Path("ios/App/App/AppDelegate.swift")

          text = path.read_text()

          insert = '''

              func application(
                  _ application: UIApplication,
                  didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data
              ) {
                  NotificationCenter.default.post(
                      name: .capacitorDidRegisterForRemoteNotifications,
                      object: deviceToken
                  )
              }

              func application(
                  _ application: UIApplication,
                  didFailToRegisterForRemoteNotificationsWithError error: Error
              ) {
                  NotificationCenter.default.post(
                      name: .capacitorDidFailToRegisterForRemoteNotifications,
                      object: error
                  )
              }
          '''

          if "capacitorDidRegisterForRemoteNotifications" not in text:

              idx = text.rfind("}")

              if idx == -1:
                  raise SystemExit(
                      "Cannot find final closing brace in AppDelegate.swift"
                  )

              text = text[:idx] + insert + text[idx:]

              path.write_text(text)

          PY

          fi

          echo "Final AppDelegate.swift:"

          cat "$APP_DELEGATE"


      # ========================================================
      # FORCE BUNDLE ID ONLY
      #
      # DO NOT FORCE CERTIFICATE
      # DO NOT FORCE PROVISIONING PROFILE
      # DO NOT FORCE CODE SIGN STYLE
      #
      # xcode-project use-profiles handles signing.
      # ========================================================

      - name: Verify and normalize Bundle ID
        script: |
          set -e

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          BUNDLE_ID="app.lovable.c6d932101224420590deeec3ccc6923f"

          echo "Setting Bundle ID to:"
          echo "$BUNDLE_ID"

          sed -i '' \
            "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" \
            "$PBXPROJ"

          echo ""
          echo "Bundle IDs in project:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBXPROJ" || true


      # ========================================================
      # INFO.PLIST
      # ========================================================

      - name: Configure iOS permissions
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          echo "Configuring Info.plist..."

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName 'CHDP Garage'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 'CHDP Garage'" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName 'CHDP Garage'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string 'CHDP Garage'" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :NSBluetoothAlwaysUsageDescription 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru ve vozidle.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru ve vozidle.'" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :NSBluetoothPeripheralUsageDescription 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth Low Energy.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth Low Energy.'" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription 'Kamera se používá pro OCR skenování VIN a SPZ.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string 'Kamera se používá pro OCR skenování VIN a SPZ.'" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :NSLocationWhenInUseUsageDescription 'Aplikace používá polohu pro servisní služby, diagnostiku a bezpečnost účtu.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string 'Aplikace používá polohu pro servisní služby, diagnostiku a bezpečnost účtu.'" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Delete :UIBackgroundModes" \
            "$PLIST" 2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string bluetooth-central" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:1 string remote-notification" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST"


          echo ""
          echo "Final Info.plist:"

          plutil -p "$PLIST"


      # ========================================================
      # APNs ENTITLEMENTS
      #
      # This only defines the app capability.
      # The actual signing profile is selected by Codemagic.
      # ========================================================

      - name: Configure APNs entitlements
        script: |
          set -e

          ENTITLEMENTS="ios/App/App/App.entitlements"

          echo "Creating APNs entitlements..."

          cat > "$ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          echo ""
          echo "Entitlements:"

          cat "$ENTITLEMENTS"


      # ========================================================
      # LINK ENTITLEMENTS TO XCODE PROJECT
      # ========================================================

      - name: Link APNs entitlements
        script: |
          set -e

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          echo "Linking App.entitlements..."

          if grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then

            sed -i '' \
              's|CODE_SIGN_ENTITLEMENTS = .*;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' \
              "$PBXPROJ"

          else

            sed -i '' \
              '/PRODUCT_BUNDLE_IDENTIFIER =/a\
                  CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\
            ' \
              "$PBXPROJ"

          fi

          echo ""
          echo "Entitlements settings:"

          grep -n \
            "CODE_SIGN_ENTITLEMENTS" \
            "$PBXPROJ" || true


      # ========================================================
      # IMPORTANT SIGNING STEP
      #
      # This is the critical replacement for the old
      # CHDP_DIST_PUSH configuration.
      #
      # Codemagic automatically applies the matching
      # App Store distribution certificate and provisioning
      # profile for the Bundle ID.
      # ========================================================

      - name: Configure automatic Codemagic iOS signing
        script: |
          set -e

          echo "Configuring iOS code signing..."

          xcode-project use-profiles \
            --project ios/App/App.xcodeproj

          echo ""
          echo "Signing configuration after use-profiles:"

          grep -n \
            "PRODUCT_BUNDLE_IDENTIFIER\|CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE\|CODE_SIGN_ENTITLEMENTS" \
            ios/App/App.xcodeproj/project.pbxproj || true


      # ========================================================
      # VERIFY SIGNING FILES
      # ========================================================

      - name: Verify iOS signing environment
        script: |
          set -e

          echo "=========================================="
          echo "IOS SIGNING VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Bundle ID:"

          grep -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/App/App.xcodeproj/project.pbxproj || true


          echo ""
          echo "Signing configuration:"

          grep -n \
            "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE\|CODE_SIGN_ENTITLEMENTS" \
            ios/App/App.xcodeproj/project.pbxproj || true


          echo ""
          echo "Provisioning profiles installed:"

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles/" \
            || true


          echo ""
          echo "Certificates available to codesign:"

          security find-identity \
            -v \
            -p codesigning \
            || true


          echo ""
          echo "APNs entitlements:"

          cat ios/App/App/App.entitlements


          echo ""
          echo "=========================================="
          echo "SIGNING VERIFICATION COMPLETE"
          echo "=========================================="


      # ========================================================
      # BUILD NUMBER
      # ========================================================

      - name: Set unique iOS build number
        script: |
          set -e

          cd ios/App

          IOS_BUILD_NUMBER="$(date +%Y%m%d%H%M)"

          echo "Using iOS build number:"
          echo "$IOS_BUILD_NUMBER"

          agvtool new-version -all "$IOS_BUILD_NUMBER"

          echo ""
          echo "Current versions:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            App/Info.plist \
            || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            App/Info.plist \
            || true


      # ========================================================
      # BUILD IPA
      # ========================================================

      - name: Build signed IPA
        script: |
          set -e

          cd ios/App

          echo "=========================================="
          echo "STARTING SIGNED IPA BUILD"
          echo "=========================================="


          rm -rf /tmp/xcodebuild_logs || true

          mkdir -p /tmp/xcodebuild_logs


          echo ""
          echo "Final project signing settings:"

          grep -n \
            "PRODUCT_BUNDLE_IDENTIFIER\|CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE\|CODE_SIGN_ENTITLEMENTS" \
            App.xcodeproj/project.pbxproj \
            || true


          echo ""
          echo "Starting xcode-project build-ipa..."


          set +e

          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App

          BUILD_EXIT=$?

          set -e


          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "XCODE BUILD FAILED"
            echo "=========================================="


            echo ""
            echo "Available Xcode logs:"

            find \
              /tmp/xcodebuild_logs \
              -maxdepth 3 \
              -type f \
              -print \
              || true


            for LOG in /tmp/xcodebuild_logs/*.log; do

              if [ -f "$LOG" ]; then

                echo ""
                echo "=========================================="
                echo "LOG: $LOG"
                echo "=========================================="

                cat "$LOG"

              fi

            done


            echo ""
            echo "=========================================="
            echo "END XCODE LOGS"
            echo "=========================================="


            exit "$BUILD_EXIT"

          fi


          echo ""
          echo "IPA build completed successfully."


      # ========================================================
      # VERIFY IPA
      # ========================================================

      - name: Verify final IPA signing and APNs
        script: |
          set -e

          IPA_PATH="$(ls ios/App/build/ios/ipa/*.ipa | head -1)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not generated"
            exit 1
          fi

          echo "IPA:"
          echo "$IPA_PATH"


          TMP_DIR="$(mktemp -d)"


          unzip -q \
            "$IPA_PATH" \
            -d "$TMP_DIR"


          APP_PATH="$(find "$TMP_DIR/Payload" -name "*.app" -type d | head -1)"


          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Signed .app not found inside IPA"
            exit 1
          fi


          echo ""
          echo "APP:"
          echo "$APP_PATH"


          echo ""
          echo "Embedded provisioning profile:"


          security cms \
            -D \
            -i "$APP_PATH/embedded.mobileprovision" \
            > "$TMP_DIR/profile.plist"


          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$TMP_DIR/profile.plist" \
            || true


          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$TMP_DIR/profile.plist" \
            || true


          echo ""
          echo "Checking APNs environment in provisioning profile..."


          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            "$TMP_DIR/profile.plist"


          echo ""
          echo "Signed application entitlements:"


          codesign \
            -d \
            --entitlements :- \
            "$APP_PATH" \
            > "$TMP_DIR/entitlements.plist" \
            2>/dev/null


          cat "$TMP_DIR/entitlements.plist"


          echo ""
          echo "Checking aps-environment..."


          grep -q \
            "aps-environment" \
            "$TMP_DIR/entitlements.plist" \
            || {
              echo "ERROR: aps-environment missing from signed application"
              exit 1
            }


          grep -q \
            "production" \
            "$TMP_DIR/entitlements.plist" \
            || {
              echo "ERROR: aps-environment is not production"
              exit 1
            }


          echo ""
          echo "=========================================="
          echo "FINAL IPA SIGNING VERIFICATION: OK"
          echo "=========================================="


    artifacts:

      - ios/App/build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


    publishing:

      app_store_connect:

        auth: integration

        submit_to_testflight: true