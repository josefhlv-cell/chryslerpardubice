workflows:
  ios-test:
    name: CHDP Garage iOS Ad Hoc
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Chdp Lukovna"

    environment:
      xcode: latest
      node: 22

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "app.lovable.c6d93210122420590deec3ccc6923f"

    scripts:

      - name: Install dependencies
        script: |
          set -e

          echo "=========================================="
          echo "INSTALL DEPENDENCIES"
          echo "=========================================="

          npm ci

      - name: Build web application
        script: |
          set -e

          echo "=========================================="
          echo "BUILD WEB APPLICATION"
          echo "=========================================="

          npm run build

      - name: Sync Capacitor iOS
        script: |
          set -e

          echo "=========================================="
          echo "SYNC CAPACITOR IOS"
          echo "=========================================="

          npx cap sync ios

      - name: Verify iOS project
        script: |
          set -e

          EXPECTED_BUNDLE_ID="app.lovable.c6d93210122420590deec3ccc6923f"

          echo "=========================================="
          echo "CHDP GARAGE iOS AD HOC"
          echo "=========================================="

          echo "Expected Bundle ID:"
          echo "$EXPECTED_BUNDLE_ID"

          echo ""
          echo "Checking iOS directory..."

          if [ ! -d "ios" ]; then
            echo "ERROR: ios directory does not exist."
            exit 1
          fi

          echo "iOS directory OK."

          PROJECT_FILE=$(find ios -name "project.pbxproj" -type f | head -1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi

          echo ""
          echo "Xcode project:"
          echo "$PROJECT_FILE"

          echo ""
          echo "Checking Bundle ID..."

          if ! grep -q "$EXPECTED_BUNDLE_ID" "$PROJECT_FILE"; then
            echo "ERROR: Bundle ID does not match."
            echo ""
            echo "Expected:"
            echo "$EXPECTED_BUNDLE_ID"
            echo ""
            echo "Bundle IDs found in project:"
            grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+' "$PROJECT_FILE" || true
            exit 1
          fi

          echo "Bundle ID verified successfully."

          echo ""
          echo "=========================================="
          echo "SIGNING CONFIGURATION"
          echo "=========================================="

          echo "Distribution type: AD HOC"
          echo "App Store Connect integration: Chdp Lukovna"
          echo "Bundle ID: $EXPECTED_BUNDLE_ID"

          echo ""
          echo "iOS project verification completed successfully."

      - name: Build IPA
        script: |
          set -e

          echo "=========================================="
          echo "BUILD IPA"
          echo "=========================================="

          cd ios/App

          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"

          echo ""
          echo "IPA BUILD COMPLETED."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
