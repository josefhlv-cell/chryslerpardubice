workflows:
  android-workflow:
    name: Android Build (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
      vars:
        PACKAGE_NAME: "app.lovable.c6d932101224420590deeec3ccc6923f"
    scripts:
      - name: Install npm dependencies (clean)
        script: |
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed, retrying with npm install to recover from an out-of-sync lockfile in CI."
            npm install --legacy-peer-deps --no-audit --no-fund
          }
      - name: Install required Android SDK packages
        script: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets (Vite)
        script: |
          npm run build
      - name: Sync Capacitor (Android)
        script: |
          npx cap sync android
      - name: Validate Android project
        script: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:tasks --no-daemon --stacktrace
      - name: Build Android Debug APK and Release AAB
        script: |
          ./android/gradlew -p android :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace --warning-mode all
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/reports/**/*

  ios-workflow:
    name: iOS Build (unsigned)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 22
    scripts:
      - name: Install npm dependencies (clean)
        script: |
          npm --version
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "npm ci failed, retrying with npm install to recover from an out-of-sync lockfile in CI."
            npm install --legacy-peer-deps --no-audit --no-fund
          }
      - name: Build web assets (Vite)
        script: |
          npm run build
      - name: Add iOS platform if missing
        script: |
          set -e
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Podfile missing — (re)adding iOS platform"
            rm -rf ios
            npx cap add ios
          else
            echo "iOS platform already present"
          fi
      - name: Patch iOS Info.plist (Bluetooth & Camera permissions)
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru (Vgate iCar Pro 4.0).'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription 'Aplikace používá Bluetooth pro připojení k OBD2 adaptéru (Vgate iCar Pro 4.0).'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription 'Aplikace komunikuje s OBD2 adaptérem přes Bluetooth.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera se používá pro OCR skenování VIN a SPZ.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Kamera se používá pro OCR skenování VIN a SPZ.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Lokalizace je vyžadována pro Bluetooth Low Energy skenování.'" "$PLIST" 2>/dev/null || true
      - name: Sync Capacitor (iOS) — copy + update without auto-pod
        script: |
          set -e
          # Use copy + update instead of `cap sync` to avoid the automatic
          # `pod install` that `cap sync` runs (it crashes on mac_mini_m2 due
          # to FFI native gem arch mismatch). We run pod install ourselves
          # in the next step with an x86_64 fallback.
          export CAPACITOR_SKIP_NATIVE_INSTALL=true
          npx cap copy ios
          npx cap update ios --deployment || npx cap update ios || true
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Podfile missing after copy/update — forcing full re-add"
            rm -rf ios
            npx cap add ios
            npx cap copy ios
          fi
          ls -la ios/App/Podfile
      - name: Install CocoaPods dependencies
        script: |
          set -e
          if [ ! -f "ios/App/Podfile" ]; then
            echo "FATAL: ios/App/Podfile not found. Aborting." >&2
            ls -la ios || true
            ls -la ios/App || true
            exit 1
          fi
          cd ios/App
          pod install --repo-update || {
            echo "pod install failed, retrying with x86_64 arch (Apple Silicon FFI fallback)"
            arch -x86_64 pod install --repo-update
          }
      - name: Build iOS app (no codesigning)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios/App/build/Build/Products/**/*.app
