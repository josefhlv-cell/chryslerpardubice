definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

workflows:
  ios-appstore:
    name: CHDP Garage iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "6807151165"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      - name: Install dependencies
        script: |
          set -e
          npm ci

      - name: Build web application
        script: |
          set -e
          npm run build

      - name: Prepare iOS project
        script: |
          set -e

          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap sync ios

          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd -
          fi

      - name: Verify iOS project
        script: |
          set -e

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo "======================================"
          echo "CHDP GARAGE iOS BUILD"
          echo "======================================"
          echo "Bundle ID:"
          echo "$BUNDLE_ID"
          echo ""

          echo "Xcode Bundle IDs:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true
          echo ""

          if ! grep -q "cz.chryslerpardubice.chdpgarage" "$PROJECT_FILE"; then
            echo "ERROR: Bundle ID cz.chryslerpardubice.chdpgarage was not found."
            exit 1
          fi

          echo "Bundle ID verification: OK"

      - name: Configure iOS signing
        script: |
          set -e

          echo "Applying Codemagic managed iOS signing..."

          xcode-project use-profiles

          echo "Signing configuration completed."

      - name: Configure Info.plist
        script: |
          set -e

          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          plutil -lint "$PLIST"

          echo "Info.plist verification: OK"

      - name: Set application version
        script: |
          set -e

          cd ios/App

          echo "Marketing version: ${MARKETING_VERSION}"

          agvtool new-marketing-version "${MARKETING_VERSION}"

          if [ -n "${BUILD_NUMBER:-}" ]; then
            echo "Build number: ${BUILD_NUMBER}"
            agvtool new-version -all "${BUILD_NUMBER}"
          fi

          cd -

      - name: Final signing verification
        script: |
          set -e

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "FINAL VERIFICATION"
          echo "======================================"

          echo "Bundle ID:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          echo ""
          echo "Code signing:"
          grep "CODE_SIGN" "$PROJECT_FILE" || true

          echo ""
          echo "Entitlements references:"
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" || true

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

      - name: Build IPA
        script: |
          set -e

          echo "======================================"
          echo "BUILDING CHDP GARAGE IPA"
          echo "======================================"

          if [ -d "ios/App/App.xcworkspace" ]; then

            echo "Using workspace:"
            echo "ios/App/App.xcworkspace"

            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"

          elif [ -d "ios/App/App.xcodeproj" ]; then

            echo "Using project:"
            echo "ios/App/App.xcodeproj"

            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"

          else

            echo "ERROR: iOS Xcode project not found."
            exit 1

          fi

          echo "IPA BUILD FINISHED."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
