definitions:
  env_versions: &env_versions
    xcode: latest
    node: 22
    cocoapods: default

workflows:
  ios-adhoc:
    name: CHDP Garage iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    # =========================================================
    # AD HOC SIGNING (bez App Store Connect integrace)
    # =========================================================
    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    # =========================================================
    # BUILD SCRIPTS
    # =========================================================
    scripts:

      - name: Install dependencies
        script: |
          set -e
          echo "======================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "======================================"
          npm ci

      - name: Build web application
        script: |
          set -e
          echo "======================================"
          echo "BUILDING WEB APPLICATION"
          echo "======================================"
          npm run build

      - name: Prepare Capacitor iOS project
        script: |
          set -e
          echo "======================================"
          echo "PREPARING CAPACITOR IOS"
          echo "======================================"

          if [ ! -d "ios" ]; then
            echo "iOS directory does not exist."
            echo "Creating Capacitor iOS project..."
            npx cap add ios
          fi

          echo "Synchronizing Capacitor..."
          npx cap sync ios

          echo "Installing CocoaPods..."
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd "$CM_BUILD_DIR"
          else
            echo "ERROR: ios/App/Podfile not found."
            exit 1
          fi

          echo "Capacitor iOS preparation: OK"

      - name: Verify iOS project
        script: |
          set -e
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
          WORKSPACE_FILE="ios/App/App.xcworkspace"

          echo "======================================"
          echo "VERIFYING IOS PROJECT"
          echo "======================================"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          if [ ! -d "$WORKSPACE_FILE" ]; then
            echo "ERROR: Xcode workspace not found:"
            echo "$WORKSPACE_FILE"
            exit 1
          fi

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          if ! grep -q "$BUNDLE_ID" "$PROJECT_FILE"; then
            echo ""
            echo "ERROR: Expected Bundle ID was not found."
            exit 1
          fi

          echo ""
          echo "Xcode project verification: OK"

      - name: Configure iOS signing
        script: |
          set -e
          echo "======================================"
          echo "CONFIGURING IOS CODE SIGNING"
          echo "======================================"
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"
          echo ""
          echo "Code signing configuration: OK"

      - name: Configure Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"

          echo "======================================"
          echo "CONFIGURING INFO.PLIST"
          echo "======================================"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          echo ""
          echo "Validating Info.plist..."
          plutil -lint "$PLIST"
          echo ""
          echo "Info.plist verification: OK"

      - name: Set marketing version
        script: |
          set -e
          echo "======================================"
          echo "SETTING MARKETING VERSION"
          echo "======================================"
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          cd "$CM_BUILD_DIR"
          echo ""
          echo "Marketing version:"
          echo "$MARKETING_VERSION"

      - name: Set build number
        script: |
          set -e
          echo "======================================"
          echo "SETTING BUILD NUMBER (timestamp-based)"
          echo "======================================"
          NEW_BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "New build number:"
          echo "$NEW_BUILD_NUMBER"
          cd ios/App
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          cd "$CM_BUILD_DIR"

      - name: Build IPA
        script: |
          set -e
          echo "======================================"
          echo "BUILDING CHDP GARAGE IPA (AD HOC)"
          echo "======================================"

          WORKSPACE="ios/App/App.xcworkspace"
          SCHEME="App"

          if [ ! -d "$WORKSPACE" ]; then
            echo "ERROR: Workspace not found:"
            echo "$WORKSPACE"
            exit 1
          fi

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$WORKSPACE" \
            --scheme "$SCHEME"

          echo ""
          echo "======================================"
          echo "IPA BUILD FINISHED SUCCESSFULLY"
          echo "======================================"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-appstore:
    name: CHDP Garage iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      <<: *env_versions

      vars:
        BUNDLE_ID: "cz.chryslerpardubice.chdpgarage"
        MARKETING_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "6807151165"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "cz.chryslerpardubice.chdpgarage"

    scripts:

      - name: Install dependencies
        script: |
          set -e
          echo "======================================"
          echo "INSTALLING NPM DEPENDENCIES"
          echo "======================================"
          npm ci

      - name: Build web application
        script: |
          set -e
          echo "======================================"
          echo "BUILDING WEB APPLICATION"
          echo "======================================"
          npm run build

      - name: Prepare Capacitor iOS project
        script: |
          set -e
          echo "======================================"
          echo "PREPARING CAPACITOR IOS"
          echo "======================================"

          if [ ! -d "ios" ]; then
            echo "iOS directory does not exist."
            echo "Creating Capacitor iOS project..."
            npx cap add ios
          fi

          echo "Synchronizing Capacitor..."
          npx cap sync ios

          echo "Installing CocoaPods..."
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd "$CM_BUILD_DIR"
          else
            echo "ERROR: ios/App/Podfile not found."
            exit 1
          fi

          echo "Capacitor iOS preparation: OK"

      - name: Verify iOS project
        script: |
          set -e
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
          WORKSPACE_FILE="ios/App/App.xcworkspace"

          echo "======================================"
          echo "VERIFYING IOS PROJECT"
          echo "======================================"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          if [ ! -d "$WORKSPACE_FILE" ]; then
            echo "ERROR: Xcode workspace not found:"
            echo "$WORKSPACE_FILE"
            exit 1
          fi

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Bundle IDs found:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          if ! grep -q "$BUNDLE_ID" "$PROJECT_FILE"; then
            echo ""
            echo "ERROR: Expected Bundle ID was not found."
            exit 1
          fi

          echo ""
          echo "Xcode project verification: OK"

      - name: Configure iOS signing
        script: |
          set -e
          echo "======================================"
          echo "CONFIGURING IOS CODE SIGNING"
          echo "======================================"
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj"
          echo ""
          echo "Code signing configuration: OK"

      - name: Configure Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"

          echo "======================================"
          echo "CONFIGURING INFO.PLIST"
          echo "======================================"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found:"
            echo "$PLIST"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Aplikace používá fotoaparát pro skenování VIN a SPZ." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Aplikace používá Bluetooth pro připojení k OBD adaptéru vozidla." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Poloha je potřeba pro Bluetooth a servisní služby." "$PLIST"

          echo ""
          echo "Validating Info.plist..."
          plutil -lint "$PLIST"
          echo ""
          echo "Info.plist verification: OK"

      - name: Set application version
        script: |
          set -e
          echo "======================================"
          echo "SETTING MARKETING VERSION"
          echo "======================================"
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          cd "$CM_BUILD_DIR"
          echo ""
          echo "Marketing version:"
          echo "$MARKETING_VERSION"

      - name: Set automatic build number
        script: |
          set -e
          echo "======================================"
          echo "SETTING BUILD NUMBER"
          echo "======================================"
          echo "Getting latest App Store Connect build..."

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID"
          )

          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid build number returned:"
            echo "$LATEST_BUILD_NUMBER"
            exit 1
          fi

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo ""
          echo "Latest build number:"
          echo "$LATEST_BUILD_NUMBER"
          echo ""
          echo "New build number:"
          echo "$NEW_BUILD_NUMBER"

          cd ios/App
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          cd "$CM_BUILD_DIR"

          echo ""
          echo "Build number configured successfully."

      - name: Final signing and version verification
        script: |
          set -e
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"

          echo "======================================"
          echo "FINAL IOS VERIFICATION"
          echo "======================================"

          echo ""
          echo "Bundle ID:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJECT_FILE" || true

          echo ""
          echo "Code signing:"
          grep "CODE_SIGN" "$PROJECT_FILE" || true

          echo ""
          echo "Entitlements:"
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" || true

          echo ""
          echo "Expected Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Expected Marketing Version:"
          echo "$MARKETING_VERSION"

          echo ""
          echo "Verification completed."

      - name: Build IPA
        script: |
          set -e
          echo "======================================"
          echo "BUILDING CHDP GARAGE IPA"
          echo "======================================"

          WORKSPACE="ios/App/App.xcworkspace"
          SCHEME="App"

          if [ ! -d "$WORKSPACE" ]; then
            echo "ERROR: Workspace not found:"
            echo "$WORKSPACE"
            exit 1
          fi

          echo ""
          echo "Workspace:"
          echo "$WORKSPACE"

          echo ""
          echo "Scheme:"
          echo "$SCHEME"

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$WORKSPACE" \
            --scheme "$SCHEME"

          echo ""
          echo "======================================"
          echo "IPA BUILD FINISHED SUCCESSFULLY"
          echo "======================================"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
