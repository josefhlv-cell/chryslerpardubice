  remote control from 08.97"><link rel="next" href="torque_position_calibration_reset.html" title="Torque/Position calibration reset"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4976026"></a><sup>[<a name="id4944490" href="#ftn.id4944490">1225</a>]</sup>System calibration</h2></div></div><hr></div><p>To ensure the Position Sensor is calibrated correctly, Check that when
  the vehicle is traveling in 30kp/h that the steering wheel returns to the
  central position when it is fully turned either to the left or right. (with
  a tolerance of +/- 20 degrees)</p><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4944490" href="#id4944490">1225</a>] </sup></p></div></div></div></body></html>
