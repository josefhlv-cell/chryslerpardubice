<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Checking water pump</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="hd_mbtruck_metering_pump.html" title="Checking/filling, metering pump"><link rel="next" href="vag_parkingbrake_a8.html" title="Service work on parking brake"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4830666"></a><sup>[<a name="id4870524" href="#ftn.id4870524">572</a>]</sup>Checking water pump</h2></div></div><hr></div><p>The test checks that the pump works.</p><p><span class="bold"><strong>Note:</strong></span></p><p>The pump is activated maximally for 30 sec.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on.</p></li><li><p>Engine off.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Start the function.</p></li><li><p>wait 20 sec.</p></li><li><p>Perform the check.</p></li><li><p>Press "OK" to finish.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4870524" href="#id4870524">572</a>] </sup></p></div></div></div></body></html>
