<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Calibrate stepper motors</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="vag_unlock_heater.html" title="Unlock additional heater"><link rel="next" href="opel_sdm_erase_crash.html" title="Erase registered crash"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id5064792"></a><sup>[<a name="id5059314" href="#ftn.id5059314">1697</a>]</sup>Calibrate stepper motors</h2></div></div><hr></div><p>This function is used to calibrate the stepper motors.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on, engine off.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Select the "Calibrate stepper motors" function.</p></li><li><p>Press "OK" to start calibrating.</p></li><li><p>Exit the function.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id5059314" href="#id5059314">1697</a>] </sup></p></div></div></div></body></html>
