<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Initiate camshaft sensor</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="hd_iveco_suspension_calibration.html" title="Level calibration half air/full air"><link rel="next" href="opel_ahm_reset_start.html" title="Reset start counter"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4851176"></a><sup>[<a name="id4860568" href="#ftn.id4860568">276</a>]</sup>Initiate camshaft sensor</h2></div></div><hr></div><p>This function initiates the camshaft sensor. Initiation is run after the sensor has been replaced.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on, engine off.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Start the function.</p></li><li><p>Follow the instructions in the program.</p></li><li><p>The function is done.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4860568" href="#id4860568">276</a>] </sup></p></div></div></div></body></html>
