<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Resetting throttle</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="opel_ecm_reset_oil_life.html" title="Resetting oil service"><link rel="next" href="opel_ecm_reset_fueladjust.html" title="Resetting fuel injection"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4834251"></a><sup>[<a name="id4830492" href="#ftn.id4830492">66</a>]</sup>Resetting throttle</h2></div></div><hr></div><p>This function is used to reset the adaptation value for the electronic throttle control.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on, engine off.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Press "OK" to start the function.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4830492" href="#id4830492">66</a>] </sup></p></div></div></div></body></html>
