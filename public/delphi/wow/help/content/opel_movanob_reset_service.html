<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Reset service interval</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="ford_con_odometer_prog.html" title="Odometer programming"><link rel="next" href="hd_man_reset_torque_limiting.html" title="Resetting torque limitation"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4805417"></a><sup>[<a name="id4874175" href="#ftn.id4874175">580</a>]</sup>Reset service interval</h2></div></div><hr></div><p>This function is used to reset service message and service interval.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on, engine off.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Start the function.</p></li><li><p>A dialogue box shows the current service interval.</p></li><li><p>Follow the instructions in the program.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4874175" href="#id4874175">580</a>] </sup></p></div></div></div></body></html>
