<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Shut off cylinder</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="opel_ecm_reset_adaption.html" title="Reset adaptation values"><link rel="next" href="opel_astra_prog_tire_size.html" title="Configure tyre size"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id5053786"></a><sup>[<a name="id5005034" href="#ftn.id5005034">1664</a>]</sup>Shut off cylinder</h2></div></div><hr></div><p>This function is used to temporarily shut off a cylinder.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Engine on.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Select the "Shut off cylinder" function.</p></li><li><p>Select the cylinder to be shut off from the drop-down list.</p></li><li><p>Press "stop" to stop the test.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id5005034" href="#id5005034">1664</a>] </sup></p></div></div></div></body></html>
