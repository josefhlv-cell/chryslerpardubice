<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Resetting oxygen sensor</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="hd_trailer_knorr_tebs_g2_service.html" title="Change service interval"><link rel="next" href="opel_ecm_reset_rail.html" title="Resetting fuel pressure sensor"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4826381"></a><sup>[<a name="id4795772" href="#ftn.id4795772">91</a>]</sup>Resetting oxygen sensor</h2></div></div><hr></div><p>This function is used to reset the adaptation value for the oxygen sensor after replacement.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on, engine off.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Press "OK" to start the function.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4795772" href="#id4795772">91</a>] </sup></p></div></div></div></body></html>
