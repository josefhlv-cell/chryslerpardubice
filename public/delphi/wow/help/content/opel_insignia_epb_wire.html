<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Service work on parking brake</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="opel_ahm_reset_start.html" title="Reset start counter"><link rel="next" href="opel_insignia_epb_tight.html" title="Activation of parking brake"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4826105"></a><sup>[<a name="id4850159" href="#ftn.id4850159">278</a>]</sup>Service work on parking brake</h2></div></div><hr></div><p>This function unwinds the parking brake cable for replacement or service.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>Ignition on, engine off.</p></li><li><p>Gear in P/N.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Start the function.</p></li><li><p>Follow the instructions in the program.</p></li><li><p>The function is done.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4850159" href="#id4850159">278</a>] </sup></p></div></div></div></body></html>
