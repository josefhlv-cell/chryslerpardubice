<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Reset trip meter</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="mit_g_and_yawrate_sensor_calibration.html" title="Calibrate yaw sensor"><link rel="next" href="mit_sensor_calibration.html" title="Reset adaptation values for sensor"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4846897"></a><sup>[<a name="id4846906" href="#ftn.id4846906">161</a>]</sup>Reset trip meter</h2></div></div><hr></div><p>This function reads out present trip meter distance and then resets the trip meter distance.</p><p><span class="bold"><strong>Test conditions:</strong></span></p><div class="itemizedlist"><ul type="disc"><li><p>External power supply connected.</p></li></ul></div><p><span class="bold"><strong>Procedure:</strong></span></p><div class="orderedlist"><ol type="1"><li><p>Start the function.</p></li><li><p>Press "OK" to reset.</p></li><li><p>The function is done.</p></li></ol></div><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4846906" href="#id4846906">161</a>] </sup></p></div></div></div></body></html>
