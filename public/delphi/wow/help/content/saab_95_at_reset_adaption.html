<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Reset adaption</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="saab_9-3_v6_learn_throttlebody.html" title="Learn Throttle Body"><link rel="next" href="servo_system_calibration.html" title="Servo system calibration"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4973416"></a><sup>[<a name="id4967057" href="#ftn.id4967057">1208</a>]</sup>Reset adaption</h2></div></div><hr></div><p>After replacement of gearbox, valve body or TCM (Transmission control
  module) shall the old self learned adaption values be reset to basic.
  Otherwise can the gearbox be damaged.</p><p>Press the OK button to reset adaption values.</p><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4967057" href="#id4967057">1208</a>] </sup></p></div></div></div></body></html>
