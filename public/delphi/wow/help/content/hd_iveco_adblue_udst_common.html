<html xmlns:cf="http://docbook.sourceforge.net/xmlns/chunkfast/1.0"><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"><title>Important</title><link rel="stylesheet" href="OBDhelp.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.69.0"><link rel="start" href="index.html" title="Help"><link rel="up" href="index.html" title="Help"><link rel="prev" href="hd_iveco_adblue_udst.html" title="UDST (Urea dosing system test)"><link rel="next" href="hd_renault_dosing_test.html" title="Dosing test"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="article" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="id4846515"></a><sup>[<a name="id4885746" href="#ftn.id4885746">493</a>]</sup>Important</h2></div></div><hr></div><p>Do not run more than two tests in a row.</p><p>If it is necessary to perform more than two tests the vehicle must first be warmed up until the catalytic converter reaches working temperature.</p><div class="footnotes"><br><hr width="100" align="left"><div class="footnote"><p><sup>[<a name="ftn.id4885746" href="#id4885746">493</a>] </sup></p></div></div></div></body></html>
